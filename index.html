<style>
/* Layout: one narrow reading column, app-style tab bar pinned to the bottom edge.
   Same family as the drill and reference pages: cobalt ink, marigold highlighter. */
:root{
  --paper:#F3F2ED; --surface:#FFFFFF; --sunk:#E9E7DF;
  --ink:#12203D; --muted:#5F6170; --rule:#D5D3CA;
  --cobalt:#1B4CA1; --cobalt-soft:#E3EAF6;
  --marigold:#D9982B; --mark:#F6D58E;
  --clay:#A83B28; --clay-soft:#F8E7E3;
  --verde:#2F7263; --verde-soft:#E2EFEB;
  --shadow:0 10px 30px rgba(18,32,61,.14);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1626; --surface:#18223A; --sunk:#111A2E;
    --ink:#E8EAF1; --muted:#9AA2B5; --rule:#2A3550;
    --cobalt:#86A9F0; --cobalt-soft:#1E2C4D;
    --marigold:#E8B04E; --mark:#5E4A1E;
    --clay:#E58A73; --clay-soft:#3A2120;
    --verde:#6FC0AC; --verde-soft:#17322D;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1626; --surface:#18223A; --sunk:#111A2E;
  --ink:#E8EAF1; --muted:#9AA2B5; --rule:#2A3550;
  --cobalt:#86A9F0; --cobalt-soft:#1E2C4D;
  --marigold:#E8B04E; --mark:#5E4A1E;
  --clay:#E58A73; --clay-soft:#3A2120;
  --verde:#6FC0AC; --verde-soft:#17322D;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:18px calc(96px + env(safe-area-inset-bottom, 0px))}

/* top line */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.brand span{color:var(--marigold)}
.streak{font-family:var(--mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* labels */
.eyebrow{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--clay)}
h1{font-weight:800;font-size:clamp(1.8rem,7vw,2.4rem);line-height:1.05;letter-spacing:-.025em;margin:.35rem 0 .2rem;text-wrap:balance}
h2{font-weight:700;font-size:1.15rem;margin:0 0 .6rem;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:0}

/* buttons */
.btn{appearance:none;border:0;border-radius:999px;padding:.75rem 1.25rem;font-weight:700;font-size:.95rem;cursor:pointer;background:var(--cobalt);color:var(--paper);transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--cobalt);box-shadow:inset 0 0 0 1.5px var(--cobalt)}
.btn.good{background:var(--verde)}
.btn.bad{background:var(--clay)}
.btn.small{padding:.45rem .9rem;font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.stretch>.btn{flex:1 1 0}

/* story */
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 18px}
.chip{font-family:var(--mono);font-size:.72rem;padding:.25rem .6rem;border-radius:999px;background:var(--sunk);color:var(--muted)}
.story{font-family:var(--read);font-size:1.32rem;line-height:1.72;margin:0 0 22px}
.story .m{background:linear-gradient(transparent 58%, var(--mark) 58%);border-radius:2px;cursor:pointer;padding:0 1px}
.story .w{cursor:pointer;border-radius:3px}
.story .w:hover,.story .m:hover{background-color:var(--cobalt-soft)}
.hint{font-size:.85rem;color:var(--muted);margin:-8px 0 20px}
.trans{font-family:var(--read);font-style:italic;font-size:1.08rem;line-height:1.65;color:var(--muted);border-left:3px solid var(--rule);padding-left:14px;margin:0 0 22px}
.wordlist{list-style:none;margin:0 0 24px;padding:0;border-top:1px solid var(--rule)}
.wordlist li{display:flex;justify-content:space-between;gap:14px;padding:.6rem 0;border-bottom:1px solid var(--rule);cursor:pointer}
.wordlist .es{font-family:var(--mono);font-weight:500;color:var(--cobalt);min-width:0}
.wordlist .es small{color:var(--muted);font-weight:400}
.wordlist .en{color:var(--muted);text-align:right;min-width:0}
.donebox{background:var(--verde-soft);border-radius:16px;padding:20px;margin-top:8px}
.donebox h2{color:var(--verde)}

/* review */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:28px 22px;text-align:center;margin:8px 0 18px}
.card .front{font-family:var(--mono);font-weight:600;font-size:clamp(1.7rem,8vw,2.3rem);color:var(--cobalt);line-height:1.2;word-break:break-word}
.card .front.en{font-family:var(--display);color:var(--ink);font-weight:700}
.card .front small{font-size:.55em;color:var(--muted);font-weight:400}
.card .ctx{font-family:var(--read);font-size:1.1rem;line-height:1.6;color:var(--muted);margin:16px 0 0}
.card .ctx b{color:var(--ink);background:linear-gradient(transparent 58%, var(--mark) 58%);font-weight:500}
.card .answer{margin-top:18px;padding-top:18px;border-top:1px dashed var(--rule)}
.card .answer .big{font-size:1.4rem;font-weight:700}
.progressbar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.progressbar i{display:block;height:100%;background:var(--marigold);width:0;transition:width .25s ease}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:.35rem .8rem;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .glyph{font-family:var(--read);font-size:3rem;color:var(--marigold);line-height:1}

/* words tab */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 22px}
.stat{background:var(--surface);border-radius:14px;padding:14px}
.stat b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.search{width:100%;padding:.75rem 1rem;border-radius:12px;border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);font:inherit;font-size:1rem}
.search:focus{border-color:var(--cobalt);outline:none}
.bank{list-style:none;margin:12px 0 28px;padding:0}
.bank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:.6rem 0;border-bottom:1px solid var(--rule);cursor:pointer}
.bank .es{font-family:var(--mono);font-weight:500;color:var(--cobalt)}
.bank .es small{color:var(--muted);font-weight:400}
.bank .en{grid-column:1;color:var(--muted);font-size:.9rem}
.bank .st{grid-row:1 / span 2;grid-column:2;align-self:center;font-family:var(--mono);font-size:.68rem;padding:.2rem .55rem;border-radius:999px}
.st.new{background:var(--sunk);color:var(--muted)}
.st.learning{background:var(--cobalt-soft);color:var(--cobalt)}
.st.known{background:var(--verde-soft);color:var(--verde)}
.more{text-align:center;color:var(--muted);font-size:.85rem;padding:10px}
.panel{background:var(--surface);border-radius:16px;padding:18px;margin-bottom:16px}
.panel p{margin:.2rem 0 .8rem;color:var(--muted);font-size:.9rem}
textarea{width:100%;min-height:90px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:.75rem;padding:10px;resize:vertical}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);
  padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px))}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;padding:.55rem 0 .45rem;cursor:pointer;font-weight:700;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button[aria-selected="true"]{color:var(--cobalt)}
.tabs svg{width:22px;height:22px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--clay);color:var(--paper);font-family:var(--mono);font-size:.62rem;font-weight:600;border-radius:999px;padding:0 .4rem;min-width:1.2rem;line-height:1.2rem;text-align:center}

/* word sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-top:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px))}
.sheet .in{max-width:640px;margin:0 auto}
.sheet .w1{font-family:var(--mono);font-size:1.7rem;font-weight:600;color:var(--cobalt);word-break:break-word}
.sheet .w1 small{font-size:.6em;color:var(--muted);font-weight:400}
.sheet .w2{font-size:1.2rem;font-weight:700;margin:.2rem 0 .3rem}
.sheet .w3{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:40;background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:999px;font-size:.85rem;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">Cuento <span>del Día</span></div>
    <div class="streak" id="streak"></div>
  </div>

  <section id="v-hoy" aria-label="Hoy"></section>
  <section id="v-repaso" aria-label="Repaso" hidden></section>
  <section id="v-palabras" aria-label="Palabras" hidden></section>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in" role="tablist">
    <button role="tab" id="t-hoy" aria-selected="true" data-v="hoy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Hoy</button>
    <button role="tab" id="t-repaso" aria-selected="false" data-v="repaso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Repaso<span class="badge" id="badge" hidden></span></button>
    <button role="tab" id="t-palabras" aria-selected="false" data-v="palabras">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Palabras</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-w" hidden>
  <div class="in">
    <div class="w1" id="sheet-w"></div>
    <div class="w2" id="sheet-en"></div>
    <p class="w3" id="sheet-note"></p>
    <div class="row">
      <button class="btn" id="sheet-say">Escuchar</button>
      <button class="btn ghost" id="sheet-slow">Despacio</button>
      <button class="btn ghost" id="sheet-close">Cerrar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

Señor, ¿[usted] es el profesor? [Nosotros] somos amigos. [Ellos] son de México. ¿Y [ustedes]?","I am Daniel. And you? He is Pablo and she is Lucía. Sir, are you the teacher? We are friends. They are from Mexico. And you all?",["yo","tú","él","ella","usted","nosotros","ellos","ustedes"]],[2,"La mochila","Daniel [es|ser] de Israel. Ahora [está|estar] en México. [Tiene|tener] una mochila grande. En la mochila [hay] un libro y un mapa. [Ve|ver] una plaza bonita. No [sabe|saber] dónde está el hotel. Pero Lucía [ha|haber] llegado para ayudar.","Daniel is from Israel. Now he is in Mexico. He has a big backpack. In the backpack there is a book and a map. He sees a pretty square. He doesn't know where the hotel is. But Lucía has arrived to help.",["ser","estar","tener","haber","hay","ver","saber"]],[3,"La plaza","[El] hotel está en [la] plaza. [Los] turistas comen tacos. [Las] calles son bonitas. Hay [un] perro y [una] gata. [Unos] niños juegan. Es la ciudad [de] Daniel por una semana.","The hotel is in the square. The tourists eat tacos. The streets are pretty. There is a dog and a cat. Some children are playing. It is Daniel's city for a week.",["el","la","los","las","un","una","unos","de"]],[4,"El león de piedra","Delante de la [catedral] hay una estatua de un [león]. Tiene una [nariz] muy grande. Un [cantante] canta en la plaza. Dice que es el [presidente] de los músicos. —¡Y yo soy el [jefe]! —dice su perro. Todos ríen. Tiene [razón]: el perro manda.","In front of the cathedral there is a statue of a lion. It has a very big nose. A singer sings in the square. He says he is the president of the musicians. 'And I'm the boss!' says his dog. Everyone laughs. He's right: the dog is in charge.",["león","nariz","jefe","razón","cantante","presidente","catedral"]],[5,"A la playa","Daniel va [a] la playa [con] Lucía. Caminan [por] la calle [sin] prisa. Llevan agua [para] el viaje. [En] la playa, ponen una toalla [sobre] la arena, [entre] dos árboles.","Daniel goes to the beach with Lucía. They walk along the street without hurrying. They bring water for the trip. At the beach, they put a towel on the sand, between two trees.",["a","en","con","por","para","sin","sobre","entre"]],[6,"¿Café o té?","¿Café [o] té? Daniel quiere café [y] pan. Lucía dice [que] no hay pan, [pero] hay fruta. [Cuando] llueve, comen en casa [porque] es más cómodo. [Si] hace sol, comen en el parque, [como] los niños.","Coffee or tea? Daniel wants coffee and bread. Lucía says that there's no bread, but there is fruit. When it rains, they eat at home because it's more comfortable. If it's sunny, they eat in the park, like the children.",["y","o","pero","que","porque","si","cuando","como"]],[7,"Muchas preguntas","Daniel pregunta mucho. ¿[Qué] es esto? ¿[Quién] es ella? ¿[Dónde] está el baño? ¿[Cuándo] sale el autobús? ¿[Cómo] se dice «gracias»? ¿[Cuál] es tu nombre? ¿[Cuánto] cuesta? Lucía ríe: ¿[Por qué] tantas preguntas?","Daniel asks a lot. What is this? Who is she? Where is the bathroom? When does the bus leave? How do you say 'thank you'? What is your name? How much does it cost? Lucía laughs: why so many questions?",["qué","quién","dónde","cuándo","cómo","cuál","cuánto","por qué"]],[8,"Una película","Daniel ve una película de [acción]. El [director] es famoso. Hay [nieve] en las montañas y un [árbol] enorme. El héroe trabaja para una [organización] secreta. Al final come un [tomate] y dice: —Mi [corazón] está tranquilo.","Daniel watches an action film. The director is famous. There's snow on the mountains and a huge tree. The hero works for a secret organization. At the end he eats a tomato and says: 'My heart is calm.'",["nieve","acción","director","tomate","corazón","organización","árbol"]],[9,"Alguien en la puerta","—¿Quieres [algo]? —pregunta Lucía. —[No], gracias, no quiero [nada]. —¿[Nunca] tienes hambre? —[Sí], [siempre] tengo hambre, pero ahora no. De repente [alguien] toca la puerta. Abren, pero no hay [nadie].","'Do you want something?' asks Lucía. 'No, thanks, I don't want anything.' 'Are you never hungry?' 'Yes, I'm always hungry, but not now.' Suddenly someone knocks on the door. They open it, but there's nobody there.",["no","sí","nunca","siempre","nada","nadie","algo","alguien"]],[10,"Practicar","Daniel [quiere|querer] [hablar] español. [Parece|parecer] difícil, pero [debe|deber] practicar. Hoy [lleva|llevar] su cuaderno al café. [Pasa|pasar] dos horas allí. Después [queda|quedar] con Lucía en el parque.","Daniel wants to speak Spanish. It seems difficult, but he must practise. Today he takes his notebook to the café. He spends two hours there. Afterwards he meets up with Lucía in the park.",["querer","pasar","deber","parecer","quedar","hablar","llevar"]],[11,"El museo","Lucía [llama|llamar] a Daniel: —¿[Vienes|venir]? Daniel [sale|salir] de casa y [toma|tomar] el autobús. [Entra|entrar] en el museo y [deja|dejar] su mochila en la puerta. [Sigue|seguir] a Lucía por las salas. A las seis [vuelven|volver] a casa.","Lucía calls Daniel: 'Are you coming?' Daniel leaves the house and takes the bus. He goes into the museum and leaves his backpack at the door. He follows Lucía through the rooms. At six they return home.",["venir","salir","volver","entrar","dejar","seguir","llamar","tomar"]],[12,"Una flor roja","En la [calle] hay mucha [luz]. Una [estudiante] vende una [flor] roja. Un [turista] la compra. Al lado, un [deportista] corre muy rápido.","There's a lot of light in the street. A student sells a red flower. A tourist buys it. Nearby, an athlete runs very fast.",["luz","deportista","calle","flor","estudiante","turista"]],[13,"La canción","Daniel no [entiende|entender] la canción, pero le [gusta|gustar]. [Siente|sentir] algo especial. [Recuerda|recordar] su casa. —¿[Necesitas|necesitar] la letra? —pregunta Lucía. —No [importa|importar] —dice él—. A veces es mejor [olvidar] las palabras.","Daniel doesn't understand the song, but he likes it. He feels something special. He remembers home. 'Do you need the lyrics?' asks Lucía. 'It doesn't matter,' he says. 'Sometimes it's better to forget the words.'",["sentir","recordar","olvidar","entender","necesitar","gustar","importar"]],[14,"¿De quién es?","—¿Es [tu] libro? —No, no es [mío]. —¿Y [este]? —Sí, es [mi] libro. —¿Y [ese] cuaderno? ¿Es [tuyo]? —No, es de Pablo. Es [su] cuaderno. —Bueno, ahora es [nuestro] cuaderno.","'Is it your book?' 'No, it's not mine.' 'And this one?' 'Yes, it's my book.' 'And that notebook? Is it yours?' 'No, it's Pablo's. It's his notebook.' 'Well, now it's our notebook.'",["mi","tu","su","nuestro","mío","tuyo","este","ese"]],[15,"Tres sopas","—¿[Te] gusta [aquel] restaurante? —pregunta Lucía. —Sí. ¿[Le] escribimos a Pablo? Pablo [nos] contesta rápido: —¡Voy! Daniel [se] ríe. Al final, el mesero [les] trae tres sopas.","'Do you like that restaurant over there?' asks Lucía. 'Yes. Shall we write to Pablo?' Pablo answers us quickly: 'I'm coming!' Daniel laughs. In the end, the waiter brings them three soups.",["te","le","nos","se","les","aquel"]],[16,"La familia de Lucía","La [familia] de Lucía es grande. Su [madre] cocina y su [padre] escucha la [radio]. Su [hermano] juega fútbol. Su [hermana] estudia en la universidad.","Lucía's family is big. Her mother cooks and her father listens to the radio. Her brother plays football. Her sister studies at university.",["madre","padre","hermano","hermana","familia","radio"]],[17,"Diez moles","—¿Qué es [esto]? —pregunta Daniel. —[Eso] es mole —dice Lucía—. [Acá] en México lo comemos mucho. —¿Y [ahí], en tu plato? —Es [otro] mole. —¿Es el [mismo]? —No. Ven [aquí]. ¿Ves el restaurante de [allí]? Tienen diez tipos.","'What is this?' asks Daniel. 'That's mole,' says Lucía. 'Here in Mexico we eat it a lot.' 'And there, on your plate?' 'It's another mole.' 'Is it the same one?' 'No. Come here. Do you see the restaurant over there? They have ten kinds.'",["aquí","allí","ahí","acá","esto","eso","otro","mismo"]],[18,"Poco a poco","[Cada] día Daniel aprende un [poco] [más]. Ya entiende [bastante]. Habla con [menos] miedo. No entiende [todo], pero no importa.","Each day Daniel learns a little more. He already understands quite a lot. He speaks with less fear. He doesn't understand everything, but it doesn't matter.",["todo","cada","poco","más","menos","bastante"]],[19,"Tarde otra vez","Son [casi] las diez. Lucía [ya] está en el café. Daniel [todavía] no. Llega [tan] tarde... Lucía ríe: —Comes [demasiado] lento y duermes [tanto]. —Es [solo] un día —dice Daniel—. Y tú [también] llegas tarde a veces.","It's almost ten. Lucía is already at the café. Daniel isn't yet. He arrives so late... Lucía laughs: 'You eat too slowly and you sleep so much.' 'It's only one day,' says Daniel. 'And you're also late sometimes.'",["ya","todavía","casi","solo","tan","tanto","demasiado","también"]],[20,"El mapa del mundo","En el museo hay un [mapa] enorme del [planeta]. Un [hombre] y una [mujer] hacen una [foto]. Hablan otro [idioma]: creo que es portugués.","In the museum there's an enormous map of the planet. A man and a woman take a photo. They speak another language: I think it's Portuguese.",["mapa","planeta","mujer","hombre","idioma","foto"]],[21,"Un mal día","[Antes] Daniel hablaba [mal]. Ahora habla [mejor]. Hoy no está [bien]: tiene dolor de cabeza. —No es nada —dice—, ayer estaba [peor]. —[Así] no puedes salir. Descansa y [luego] vemos. [Después] de la siesta, se siente bien.","Before, Daniel spoke badly. Now he speaks better. Today he isn't well: he has a headache. 'It's nothing,' he says, 'yesterday I was worse.' 'You can't go out like this. Rest and we'll see later.' After the nap, he feels fine.",["bien","mal","mejor","peor","así","luego","después","antes"]],[22,"A Oaxaca","[Anoche] Daniel durmió poco. [Ayer] trabajó mucho. [Hoy] se levanta [tarde]. [Ahora] desayuna. [Mañana] se levanta [temprano] porque viaja a Oaxaca. ¡[Pronto]!","Last night Daniel slept little. Yesterday he worked a lot. Today he gets up late. Now he is having breakfast. Tomorrow he gets up early because he's travelling to Oaxaca. Soon!",["ahora","hoy","mañana","ayer","pronto","tarde","temprano","anoche"]],[23,"El hotel","El hotel no está [lejos]; está [cerca] del mercado. La habitación de Daniel está [arriba]; el restaurante, [abajo]. [Dentro] hace calor y [fuera] hace sol. [Delante] del hotel hay una fuente y [detrás] hay un jardín.","The hotel isn't far; it's near the market. Daniel's room is upstairs; the restaurant, downstairs. Inside it's hot and outside it's sunny. In front of the hotel there's a fountain and behind it there's a garden.",["cerca","lejos","arriba","abajo","dentro","fuera","delante","detrás"]],[24,"Un problema en el camino","Un [día], en el campo, Daniel ve una [vaca] y un [toro] en el camino. ¡Es un [problema]! El autobús no puede pasar. La [solución]: esperar.","One day, in the countryside, Daniel sees a cow and a bull on the road. It's a problem! The bus can't get past. The solution: wait.",["día","toro","solución","problema","vaca"]],[25,"¿Vamos al mercado?","—¿Vamos al mercado? —[Claro]. [Aunque] [tal vez] va a llover. —[Entonces] llevamos paraguas. [Mientras] caminan, Lucía habla de la comida. —[Además], [quizás] hay tamales. —[Pues] vamos rápido.","'Shall we go to the market?' 'Of course. Although maybe it's going to rain.' 'Then we'll take umbrellas.' While they walk, Lucía talks about the food. 'Besides, perhaps there are tamales.' 'Well, let's go quickly.'",["quizás","tal vez","claro","aunque","mientras","entonces","además","pues"]],[26,"Hacia el sur","[Durante] el viaje, el autobús va [hacia] el sur. [Según] el chofer, llegan [hasta] Oaxaca a las seis. [Desde] la ventana, Daniel ve montañas. No hay wifi [ni] café. No está aburrido, [sino] feliz. El viento sopla [contra] la ventana.","During the trip, the bus heads south. According to the driver, they get as far as Oaxaca at six. From the window, Daniel sees mountains. There's no wifi or coffee. He isn't bored, but happy. The wind blows against the window.",["hasta","desde","hacia","contra","durante","según","sino","ni"]],[27,"En el mercado","En el mercado de Oaxaca, Daniel compra [dos] mangos, [tres] aguacates y [cuatro] tortillas. Una señora vende [cinco] tipos de chile. Paga [seis] pesos por un café. A las [siete] cierra el mercado; a las [ocho] Daniel cena.","At the market in Oaxaca, Daniel buys two mangoes, three avocados and four tortillas. A woman sells five kinds of chilli. He pays six pesos for a coffee. At seven the market closes; at eight Daniel has dinner.",["dos","tres","cuatro","cinco","seis","siete","ocho"]],[28,"Los caballos","Un [señor] tiene dos [caballos] en el campo. Les da una [manzana] a cada uno. Arriba, unos [pájaros] cantan. Daniel saca una foto y dice: —¡[Adiós]!","A gentleman has two horses in the countryside. He gives each of them an apple. Above, some birds are singing. Daniel takes a photo and says: 'Goodbye!'",["manzana","señor","caballos","pájaros","adiós"]],[29,"El hostal","El hostal tiene [doce] habitaciones. Daniel duerme en la habitación [once]. Cuesta [veinte] dólares por noche, o [cincuenta] por tres noches. El desayuno es de [nueve] a [diez]. Hay [quince] turistas, ¡y [treinta] toallas!","The hostel has twelve rooms. Daniel sleeps in room eleven. It costs twenty dollars a night, or fifty for three nights. Breakfast is from nine to ten. There are fifteen tourists, and thirty towels!",["nueve","diez","once","doce","quince","veinte","treinta","cincuenta"]],[30,"Cien escalones","La región de Oaxaca tiene casi un [millón] de habitantes. El templo tiene más de [mil] años. Hay [cien] escalones. El [primer|primero] día Daniel sube [medio] camino. El [segundo] día sube más. El [tercer|tercero] día llega al [último] escalón.","The Oaxaca region has almost a million inhabitants. The temple is more than a thousand years old. There are a hundred steps. On the first day Daniel climbs half the way. On the second day he climbs more. On the third day he reaches the last step.",["cien","mil","millón","primero","segundo","tercero","último","medio"]],[31,"El viaje del siglo","Daniel no tiene mucho [tiempo]. El autobús sale en una [hora]. Espera un [rato] en la estación. Cada [minuto] mira el reloj. Es la primera [vez] que viaja solo este [año]. En ese [momento] piensa: «Este es el viaje del [siglo]».","Daniel doesn't have much time. The bus leaves in an hour. He waits a while at the station. Every minute he looks at his watch. It's the first time he's travelled alone this year. At that moment he thinks: 'This is the trip of the century.'",["tiempo","hora","minuto","año","vez","momento","rato","siglo"]],[32,"Domingo","Pablo es [informático], pero le gusta el [arte]. El domingo van al [mercado] y después al [parque]. Un [panadero] vende pan dulce. Daniel cierra los [ojos]: huele delicioso. Por la noche van al [cine].","Pablo is an IT worker, but he likes art. On Sunday they go to the market and then to the park. A baker sells sweet bread. Daniel closes his eyes: it smells delicious. In the evening they go to the cinema.",["arte","cine","informático","mercado","ojos","parque","panadero"]],[33,"El cumpleaños de Lucía","Hoy es el [cumpleaños] de Lucía. ¿La [fecha]? El [fin] de las [vacaciones]. Hay una [fiesta] en su casa por la [noche]. Al [principio] Daniel está tímido. Le regala un [reloj] bonito.","Today is Lucía's birthday. The date? The end of the holidays. There's a party at her house in the evening. At the beginning Daniel is shy. He gives her a pretty watch.",["noche","fin","principio","fecha","cumpleaños","vacaciones","fiesta","reloj"]],[34,"Los meses","En [enero] y [febrero] hace frío en el norte. En [marzo] y [abril] hay flores. [Mayo] es muy caluroso. En [junio] y [julio] llueve mucho. Daniel llegó un [sábado] de julio.","In January and February it's cold in the north. In March and April there are flowers. May is very hot. In June and July it rains a lot. Daniel arrived on a Saturday in July.",["sábado","enero","febrero","marzo","abril","mayo","junio","julio"]],[35,"Navidad en la playa","En [agosto] es [verano] en México, pero en Argentina es [invierno]. En [septiembre] empieza la [primavera] allí. A finales de [octubre] y en [noviembre] se celebra el Día de Muertos. Y en [diciembre], en Argentina, ¡Navidad en la playa!","In August it's summer in Mexico, but in Argentina it's winter. In September spring begins there. At the end of October and in November the Day of the Dead is celebrated. And in December, in Argentina, Christmas on the beach!",["agosto","septiembre","octubre","noviembre","diciembre","primavera","verano","invierno"]],[36,"El vecino","El [vecino] de Lucía es un [chico] muy simpático. Su [mamá] es [pescadera] en el mercado y [abre|abrir] la tienda a las seis. Hoy el chico va a la [playa] con un [amigo].","Lucía's neighbour is a very nice guy. His mum is a fishmonger at the market and opens the shop at six. Today the guy is going to the beach with a friend.",["pescadera","playa","vecino","chico","amigo","mamá","abrir"]],[37,"La estación de tren","En la [estación] de tren hay un museo de [historia]. Daniel [mira|mirar] fotos del [pasado]: la [época] de los trenes antiguos. —¿Qué [edad] tiene esta foto? —Cien años. El [presente] es diferente, y el [futuro]... ¿quién sabe? Fuera, caen las hojas de [otoño].","At the train station there is a history museum. Daniel looks at photos of the past: the era of old trains. 'How old is this photo?' 'A hundred years.' The present is different, and the future... who knows? Outside, the autumn leaves are falling.",["otoño","estación","futuro","pasado","presente","historia","época","edad","mirar"]],[38,"La clase","Daniel [estudia|estudiar] por la mañana y [trabaja|trabajar] por la tarde. La clase [empieza|empezar] a las nueve. La profesora [explica|explicar] la gramática. Daniel [pregunta|preguntar] mucho. [Trata|tratar] de entender. La clase [termina|terminar] a las once, pero él [continúa|continuar] en casa. A las doce [acaba|acabar] la tarea.","Daniel studies in the morning and works in the afternoon. The class begins at nine. The teacher explains the grammar. Daniel asks a lot. He tries to understand. The class ends at eleven, but he continues at home. At twelve he finishes the homework.",["empezar","terminar","acabar","continuar","tratar","trabajar","estudiar","preguntar","explicar"]],[39,"La tarjeta perdida","Daniel [pierde|perder] su tarjeta en el mercado. ¡Qué problema! No puede [pagar]. Un señor que [vende|vender] frutas lo ayuda. Al día siguiente Daniel [recibe|recibir] un mensaje del banco: puede [conseguir] una tarjeta nueva.","Daniel loses his card at the market. What a problem! He can't pay. A man who sells fruit helps him. The next day Daniel receives a message from the bank: he can get a new card.",["recibir","conseguir","perder","pagar","vender"]],[40,"Tortillas","La abuela de Lucía enseña a Daniel a hacer tortillas. Primero [amasa|amasar] la masa. Luego [añade|añadir] agua y [agrega|agregar] sal. Daniel quiere [aprender]. Al final [apaga|apagar] el fuego. —¡[Amo|amar] las tortillas! —dice Daniel. La abuela [acepta|aceptar] el elogio con una sonrisa.","Lucía's grandmother teaches Daniel to make tortillas. First she kneads the dough. Then she adds water and adds salt. Daniel wants to learn. At the end she turns off the fire. 'I love tortillas!' says Daniel. The grandmother accepts the compliment with a smile.",["aceptar","amar","amasar","añadir","agregar","apagar","aprender"]],[41,"Una semana más","En el hostal, Daniel [ayuda|ayudar] en la cocina. [Usa|usar] un cuchillo grande y [sirve|servir] el desayuno. El dueño le [ofrece|ofrecer] una noche gratis. —¿Me [permite|permitir] [utilizar] la cocina por la noche? —Claro. Daniel [decide|decidir] quedarse una semana más.","At the hostel, Daniel helps in the kitchen. He uses a big knife and serves breakfast. The owner offers him a free night. 'Will you allow me to use the kitchen in the evening?' 'Of course.' Daniel decides to stay one more week.",["ayudar","usar","utilizar","servir","ofrecer","permitir","decidir"]],[42,"El volcán","Lucía [despierta|despertar] a Daniel a las cinco. Van a [subir] un volcán. [Preparan|preparar] café y [comen|comer] pan. Arriba, Daniel [saca|sacar] la cámara. [Levanta|levantar] los brazos: ¡qué vista! Al [bajar], casi se [cae|caer]. Después no puede [mover] las piernas en todo el día.","Lucía wakes Daniel up at five. They're going to climb a volcano. They make coffee and eat bread. At the top, Daniel takes out the camera. He raises his arms: what a view! Coming down, he almost falls. Afterwards he can't move his legs all day.",["subir","bajar","caer","mover","levantar","sacar","comer","preparar","despertar"]],[43,"Planes","Daniel quiere [viajar] por Colombia. Va a [volar] de México a Bogotá. Primero va a [visitar] a un amigo. Luego va a [cruzar] los Andes en autobús. —¿Cuándo [regresas|regresar]? —pregunta Lucía. —No sé. Quiero [quedarme|quedarse] mucho tiempo. —Pues antes de [irte|irse], ven a cenar.","Daniel wants to travel around Colombia. He's going to fly from Mexico to Bogotá. First he's going to visit a friend. Then he's going to cross the Andes by bus. 'When are you coming back?' asks Lucía. 'I don't know. I want to stay a long time.' 'Well, before you leave, come for dinner.'",["viajar","visitar","volar","cruzar","regresar","quedarse","irse"]],[44,"La maleta","Antes del viaje, Daniel limpia el cuarto. [Barre|barrer] el piso y [aspira|aspirar] la alfombra. [Busca|buscar] su pasaporte. La ropa no [cabe|caber] en la maleta. Por la noche, en la fiesta, [beben|beber] y [bailan|bailar]. Lucía dice: —En Colombia tienes que [bucear] en el Caribe.","Before the trip, Daniel cleans the room. He sweeps the floor and vacuums the rug. He looks for his passport. The clothes don't fit in the suitcase. At night, at the party, they drink and dance. Lucía says: 'In Colombia you have to dive in the Caribbean.'",["aspirar","bailar","barrer","beber","bucear","buscar","caber"]],[45,"La despedida","En la fiesta de despedida todos [cantan|cantar] y [ríen|reír]. Pablo [rompe|romper] un vaso sin querer, pero Lucía [arregla|arreglar] el momento con una broma. Daniel [guarda|guardar] una foto del grupo. Al final [abraza|abrazar] a sus amigos. La abuela le [besa|besar] la frente y [sonríe|sonreír].","At the farewell party everyone sings and laughs. Pablo breaks a glass by accident, but Lucía saves the moment with a joke. Daniel keeps a photo of the group. At the end he hugs his friends. The grandmother kisses his forehead and smiles.",["reír","sonreír","cantar","abrazar","besar","romper","arreglar","guardar"]],[46,"En el avión","En el avión, Daniel [repasa|repasar] sus palabras. [Practica|practicar] con la azafata. —¿Qué [significa|significar] «chévere»? —pregunta. —Cool —[responde|responder] ella—. ¡Pero en Colombia, no en México! Daniel [repite|repetir] la palabra. A veces [se equivoca|equivocarse], pero no importa.","On the plane, Daniel reviews his words. He practises with the flight attendant. 'What does «chévere» mean?' he asks. 'Cool,' she answers. 'But in Colombia, not in Mexico!' Daniel repeats the word. Sometimes he makes mistakes, but it doesn't matter.",["responder","practicar","repasar","equivocarse","significar","repetir"]],[47,"Bogotá","Bogotá le [encanta|encantar] a Daniel. Le [interesa|interesar] la historia. [Odia|odiar] el tráfico, pero no le [molesta|molestar] mucho. [Prefiere|preferir] caminar. [Disfruta|disfrutar] de un café colombiano y piensa: «No [deseo|desear] nada más».","Daniel loves Bogotá. He's interested in the history. He hates the traffic, but it doesn't bother him much. He prefers to walk. He enjoys a Colombian coffee and thinks: 'I don't wish for anything more.'",["odiar","preferir","desear","interesar","encantar","molestar","disfrutar"]],[48,"Cambio de plan","Llueve. El tour [comienza|comenzar] a las diez, pero lo [cancelan|cancelar]. Daniel [cambia|cambiar] de plan. [Camina|caminar] al mercado, compra arepas y [cocina|cocinar] en el hostal. Por la noche [celebran|celebrar] el cumpleaños de una chica alemana. El bar [cierra|cerrar] a las dos.","It's raining. The tour starts at ten, but they cancel it. Daniel changes his plan. He walks to the market, buys arepas and cooks at the hostel. In the evening they celebrate a German girl's birthday. The bar closes at two.",["cambiar","caminar","cancelar","celebrar","cerrar","cocinar","comenzar"]],[49,"Una mañana","Daniel [se despierta|despertarse] a las siete. [Se levanta|levantarse], [se ducha|ducharse] y [se viste|vestirse]. En el desayuno [se sienta|sentarse] con un chico. —¿Cómo [te llamas|llamarse]? —Andrés. Hablan una hora. Daniel [se siente|sentirse] feliz. Esa noche [se acuesta|acostarse] tarde.","Daniel wakes up at seven. He gets up, showers and gets dressed. At breakfast he sits down with a guy. 'What's your name?' 'Andrés.' They talk for an hour. Daniel feels happy. That night he goes to bed late.",["sentarse","levantarse","acostarse","ducharse","vestirse","llamarse","sentirse","despertarse"]],[50,"La leyenda","Andrés cuenta una leyenda: un guerrero [lucha|luchar] contra un monstruo para [salvar] su pueblo. El monstruo quiere [atacar] a los niños. El guerrero los [protege|proteger] y [defiende|defender] la montaña. Pero no quiere [matar] al monstruo; quiere [evitar] la guerra.","Andrés tells a legend: a warrior fights a monster to save his village. The monster wants to attack the children. The warrior protects them and defends the mountain. But he doesn't want to kill the monster; he wants to avoid war.",["proteger","salvar","luchar","matar","evitar","defender","atacar"]],[51,"Una postal","Andrés le [presta|prestar] un libro a Daniel. —Me lo [devuelves|devolver] el viernes. Daniel [elige|elegir] una postal y se la [manda|mandar] a Lucía. Por la tarde [recogen|recoger] frutas en el mercado y las [comparten|compartir] con el hostal. Andrés [trae|traer] café.","Andrés lends Daniel a book. 'Give it back to me on Friday.' Daniel chooses a postcard and sends it to Lucía. In the afternoon they pick up fruit at the market and share it with the hostel. Andrés brings coffee.",["elegir","mandar","prestar","devolver","compartir","recoger","traer"]],[52,"El menú del día","En el restaurante, la [comida] es barata. De [primer plato] hay sopa de [verduras]. Después, [carne] con arroz. La [bebida]: un [jugo] de [frutas]. Y de [postre], ¡arroz con leche!","At the restaurant, the food is cheap. For the first course there's vegetable soup. Then, meat with rice. The drink: a fruit juice. And for dessert, rice pudding!",["comida","bebida","frutas","postre","jugo","verduras","carne","primer plato"]],[53,"Medellín","Medellín [crece|crecer] mucho. Los arquitectos [diseñan|diseñar] bibliotecas y [construyen|construir] escaleras eléctricas en los barrios. Quieren [mejorar] la vida de la gente y [crear] espacios para todos. Cada año [aumenta|aumentar] el turismo.","Medellín is growing a lot. Architects design libraries and build escalators in the neighbourhoods. They want to improve people's lives and create spaces for everyone. Every year tourism increases.",["construir","diseñar","mejorar","crecer","crear","aumentar"]],[54,"En el autobús","En el autobús a la costa, Daniel no [se aburre|aburrirse]. [Sueña|soñar] con el mar. [Imagina|imaginar] la playa. De repente [nota|notar] a una chica que lee. ¿La [reconoce|reconocer]? [Duda|dudar]... Es la chica alemana del hostal. Hablan y [descubren|descubrir] que van al mismo pueblo.","On the bus to the coast, Daniel doesn't get bored. He dreams of the sea. He imagines the beach. Suddenly he notices a girl reading. Does he recognise her? He hesitates... It's the German girl from the hostel. They talk and discover that they're going to the same town.",["soñar","imaginar","dudar","notar","aburrirse","reconocer","descubrir"]],[55,"La costa","En la costa el sol [brilla|brillar]. Aquí nunca [nieva|nevar]. Unos niños [saltan|saltar] al agua. Un niño [empuja|empujar] a su hermano y otro le [tira|tirar] una pelota. En la arena, un señor [toca|tocar] la guitarra.","On the coast the sun shines. It never snows here. Some children jump into the water. One boy pushes his brother and another throws him a ball. On the sand, a man plays the guitar.",["nevar","brillar","saltar","tirar","empujar","tocar"]],[56,"Un restaurante español","En Cartagena hay un restaurante español. Piden una [tapa] de [garbanzos|garbanzo] con espinacas. De [segundo plato], tortilla de [huevos] y [calabacín]. Toman [vino] tinto. Para el café, Daniel pide [leche].","In Cartagena there's a Spanish restaurant. They order a tapa of chickpeas with spinach. For the main course, an omelette with eggs and courgette. They drink red wine. For his coffee, Daniel asks for milk.",["segundo plato","vino","garbanzo","calabacín","huevos","tapa","leche"]],[57,"Una invitación","Andrés escribe: «¡Mi hermana [se casa|casarse] en junio! Te [invito|invitar] a la boda». Daniel [saluda|saludar] a toda la familia por videollamada. La abuela cuenta que [nació|nacer] en ese pueblo. Daniel le [agradece|agradecer] la invitación y [se despide|despedirse].","Andrés writes: 'My sister is getting married in June! I'm inviting you to the wedding.' Daniel greets the whole family by video call. The grandmother says she was born in that town. Daniel thanks her for the invitation and says goodbye.",["invitar","casarse","saludar","despedirse","agradecer","nacer"]],[58,"La ciudad perdida","¿[Existe|existir] la ciudad perdida? Sí: está en la selva. Para llegar, hay que caminar cuatro días. —[Supongo|suponer] que es difícil —dice Daniel. —Sí, pero [vale|valer] la pena. Nunca [ocurre|ocurrir] nada malo. Daniel [logra|lograr] llegar y [cumple|cumplir] un sueño.","Does the lost city exist? Yes: it's in the jungle. To get there, you have to walk for four days. 'I suppose it's difficult,' says Daniel. 'Yes, but it's worth it. Nothing bad ever happens.' Daniel manages to get there and fulfils a dream.",["existir","ocurrir","suponer","lograr","valer","cumplir"]],[59,"Doña Rosa","En el pueblo vive poca [gente]. Daniel conoce a doña Rosa, una [persona] muy amable. Su [esposo] es pescador. Tienen un [hijo] y una [hija]: el [niño] tiene siete años y la [niña], cinco. Doña Rosa cocina para los turistas, y la [esposa] del vecino la ayuda.","Few people live in the village. Daniel meets doña Rosa, a very kind person. Her husband is a fisherman. They have a son and a daughter: the boy is seven and the girl, five. Doña Rosa cooks for the tourists, and the neighbour's wife helps her.",["persona","gente","niño","niña","hijo","hija","esposo","esposa"]],[60,"El dibujo","La niña dibuja con [lápices] de colores. Dibuja un [kiwi], un [vaso] de leche, un [tenedor] y un sándwich de [jamón]. Pone el dibujo en la [pared]. Afuera pasa un [camión] muy ruidoso.","The girl draws with coloured pencils. She draws a kiwi, a glass of milk, a fork and a ham sandwich. She puts the drawing on the wall. Outside a very noisy truck goes by.",["jamón","kiwi","lápices","tenedor","pared","camión","vaso"]],[61,"La boda","La boda es en el pueblo de la familia de Andrés. Están todos: el [abuelo], la [abuela], un [tío] que canta y una [tía] que llora. Un [primo] pequeño corre por todas partes. La [novia] está muy guapa y el [novio], muy nervioso. El [bebé] duerme durante toda la fiesta.","The wedding is in the village of Andrés's family. Everyone is there: the grandfather, the grandmother, an uncle who sings and an aunt who cries. A little cousin runs everywhere. The bride looks very beautiful and the groom, very nervous. The baby sleeps through the whole party.",["abuelo","abuela","tío","tía","primo","novio","novia","bebé"]],[62,"En la mesa","En la boda, Daniel habla con una [chica]: es [amiga] de la novia. Su [compañero] de trabajo es el [dueño] del restaurante. Una [señora] mayor le pregunta: —Usted es muy [joven]. ¿Está casado?","At the wedding, Daniel talks to a girl: she's a friend of the bride. Her colleague is the owner of the restaurant. An older lady asks him: 'You are very young. Are you married?'",["amiga","compañero","chica","señora","joven","dueño"]],[63,"Todas las profesiones","En la mesa de Daniel hay gente de muchas profesiones: un [médico], un [enfermero], una [abogada|abogado], un [ingeniero] y un [maestro]. Hasta un [policía] baila salsa. El [mesero] trae más comida. —En España dicen [camarero] —explica Daniel. —Aquí, mesero —ríe la abogada.","At Daniel's table there are people of many professions: a doctor, a nurse, a lawyer, an engineer and a teacher. Even a police officer dances salsa. The waiter brings more food. 'In Spain they say camarero,' Daniel explains. 'Here, mesero,' the lawyer laughs.",["médico","enfermero","policía","abogado","ingeniero","maestro","mesero","camarero"]],[64,"Una nube negra","Al día siguiente, Andrés [conduce|conducir] a Daniel a la ciudad. Paran a [comprar] [pan]. Hay una [nube] negra en el cielo. —¿[Conoces|conocer] esta carretera? —Sí. Andrés tose. —No te quiero [contagiar] —dice. Daniel [comprende|comprender] y abre la ventana.","The next day, Andrés drives Daniel to the city. They stop to buy bread. There's a black cloud in the sky. 'Do you know this road?' 'Yes.' Andrés coughs. 'I don't want to infect you,' he says. Daniel understands and opens the window.",["pan","nube","comprar","comprender","conducir","conocer","contagiar"]],[65,"El tour","En Bogotá, Daniel hace un tour con un [guía]. El [conductor] del autobús es muy simpático. Ven a un [artista] que pinta en la calle y a un [vendedor] de café. El guía dice que en este barrio vivió un [escritor] famoso. Un [trabajador] de una tienda saluda a un [cliente]. Al final, el guía cuenta que antes era [doctor].","In Bogotá, Daniel takes a tour with a guide. The bus driver is very friendly. They see an artist painting in the street and a coffee seller. The guide says that a famous writer lived in this neighbourhood. A shop worker greets a customer. At the end, the guide says he used to be a doctor.",["conductor","vendedor","cliente","trabajador","artista","escritor","doctor","guía"]],[66,"El museo del Oro","En el museo del Oro, Daniel aprende historia. Antes, un [rey] y una [reina] gobernaban el [pueblo] muisca. Después llegaron los españoles. Hoy Colombia tiene un [gobierno] democrático y una [ley] que protege a los indígenas. La [ciudad] es moderna, y la [sociedad], diversa. El oro de Colombia es famoso en todo el [mundo].","At the Gold Museum, Daniel learns history. In the past, a king and a queen governed the Muisca people. Then the Spanish arrived. Today Colombia has a democratic government and a law that protects indigenous people. The city is modern, and society, diverse. Colombia's gold is famous all over the world.",["rey","reina","gobierno","ciudad","pueblo","mundo","sociedad","ley"]],[67,"La máscara","En el museo hay una máscara de oro. Tiene [cara] de hombre, una [boca] grande y un [diente] largo. En cada [oreja] hay un círculo. Encima de la [cabeza] lleva plumas como [pelo]. Su [cuerpo] es pequeño.","In the museum there's a gold mask. It has a man's face, a big mouth and a long tooth. In each ear there's a circle. On top of its head it has feathers like hair. Its body is small.",["cuerpo","cabeza","cara","boca","oreja","pelo","diente"]],[68,"La finca de café","Daniel visita una finca de café. Los trabajadores [cosechan|cosechar] el café a mano. Un señor [cuenta|contar] los sacos. Daniel [charla|charlar] con él en español. Cuando se equivoca, el señor lo [corrige|corregir]. Daniel le pregunta mucho y él [contesta|contestar] con paciencia. Unos niños [corren|correr] y [cortan|cortar] flores.","Daniel visits a coffee farm. The workers harvest the coffee by hand. A man counts the sacks. Daniel chats with him in Spanish. When he makes a mistake, the man corrects him. Daniel asks him a lot and he answers patiently. Some children run and cut flowers.",["contar","contestar","charlar","corregir","correr","cortar","cosechar"]],[69,"Todo duele","Daniel ayuda a cosechar café. Al final del día le duele todo: la [espalda], el [brazo], la [pierna] y hasta el [pie]. Tiene un poco de [sangre] en un [dedo]. Se lava la [mano]. El señor le da sopa caliente: —Para el [estómago] y para el alma.","Daniel helps harvest coffee. At the end of the day everything hurts: his back, his arm, his leg and even his foot. He has a bit of blood on a finger. He washes his hand. The man gives him hot soup: 'For the stomach and for the soul.'",["mano","brazo","pierna","pie","dedo","espalda","estómago","sangre"]],[70,"Enfermo","Al día siguiente Daniel está [enfermo]. Tiene [fiebre] y [dolor] de cabeza. No quiere ir al [hospital]. Andrés va a la [farmacia] y compra una [medicina]. —Bebe mucha agua —dice—. La [salud] es lo primero. Dos días después, Daniel está [sano] otra vez.","The next day Daniel is sick. He has a fever and a headache. He doesn't want to go to the hospital. Andrés goes to the pharmacy and buys some medicine. 'Drink lots of water,' he says. 'Health comes first.' Two days later, Daniel is healthy again.",["salud","dolor","enfermo","medicina","hospital","farmacia","sano","fiebre"]],[71,"La casa de Andrés","Andrés vive en una [casa] vieja con una [puerta] azul. Tiene una [cocina] grande, un [baño] pequeño y tres [habitaciones|habitación]. El [cuarto] de Daniel tiene una [ventana] con vista a las montañas. —Esta es tu casa —dice Andrés—. Bienvenido a mi [hogar].","Andrés lives in an old house with a blue door. It has a big kitchen, a small bathroom and three bedrooms. Daniel's room has a window with a view of the mountains. 'This is your house,' says Andrés. 'Welcome to my home.'",["casa","hogar","puerta","ventana","habitación","cuarto","cocina","baño"]],[72,"La lista","Daniel lleva un [mes] en el [país]. Escribe en un [papel] con un [lápiz]: «Cosas que quiero hacer». Primero: comer [arroz] con coco. Segundo: tomar el [autobús] a Ecuador. Tercero: hacer [esquí]... ¡pero no hay nieve! —¡[Dios] mío! —ríe Andrés.","Daniel has been in the country for a month. He writes on a piece of paper with a pencil: 'Things I want to do.' First: eat coconut rice. Second: take the bus to Ecuador. Third: go skiing... but there's no snow! 'My God!' laughs Andrés.",["arroz","autobús","dios","esquí","lápiz","mes","país","papel"]],[73,"Un piso en Quito","En Quito, Daniel alquila un [piso] pequeño. Hay una [cama], una [mesa], dos [sillas|silla] y un [sofá] viejo. Para subir hay una [escalera] estrecha. El [techo] es muy alto. La dueña le da la [llave] y dice: —Bienvenido.","In Quito, Daniel rents a small flat. There's a bed, a table, two chairs and an old sofa. To go up there's a narrow staircase. The ceiling is very high. The owner gives him the key and says: 'Welcome.'",["cama","mesa","silla","sofá","llave","piso","techo","escalera"]],[74,"Ropa nueva","En Quito hace frío por la mañana y calor a mediodía. Daniel no tiene la [ropa] correcta: solo una [camiseta] y una [camisa]. Compra [pantalones] largos, [zapatos] cómodos y un [sombrero] de Panamá... que es de Ecuador. Una niña en el mercado vende [agua] y lleva un [vestido] de colores.","In Quito it's cold in the morning and hot at midday. Daniel doesn't have the right clothes: only a T-shirt and a shirt. He buys long trousers, comfortable shoes and a Panama hat... which is from Ecuador. A girl at the market sells water and wears a colourful dress.",["agua","ropa","camisa","pantalones","zapatos","vestido","sombrero","camiseta"]],[75,"La mochila otra vez","Daniel organiza su [mochila]: el [celular], la [cámara], un [libro] y una [bolsa] con comida. Deja la [computadora] en el piso. El [teléfono] fijo suena: es la dueña. —¿Funciona la [televisión]? —Sí, pero nunca la miro.","Daniel packs his backpack: his mobile, the camera, a book and a bag of food. He leaves the computer in the flat. The landline rings: it's the owner. 'Does the television work?' 'Yes, but I never watch it.'",["bolsa","mochila","teléfono","celular","computadora","televisión","cámara","libro"]],[76,"La granja","En una granja cerca de Quito hay muchos animales: un [perro], un [gato], un [cerdo] gordo, un [conejo] blanco y un [caballo]. Un [pájaro] canta en el techo. En el estanque hay un [pez] naranja. —¿Comes [pescado]? —pregunta el granjero. —Sí, pero no ese.","On a farm near Quito there are lots of animals: a dog, a cat, a fat pig, a white rabbit and a horse. A bird sings on the roof. In the pond there's an orange fish. 'Do you eat fish?' asks the farmer. 'Yes, but not that one.'",["pez","pescado","perro","gato","cerdo","pájaro","conejo","caballo"]],[77,"Una carta","Daniel escribe una [carta] a Lucía con una [pluma]. Antes, busca cada [palabra] en su [cuaderno]. Escribe una [página] entera. Su [letra] es fea, pero cada [frase] es correcta. «El español ya es mi segunda [lengua]», piensa.","Daniel writes a letter to Lucía with a pen. First, he looks up every word in his notebook. He writes a whole page. His handwriting is ugly, but every sentence is correct. 'Spanish is already my second language,' he thinks.",["carta","pluma","cuaderno","página","palabra","lengua","frase","letra"]],[78,"El desayuno","El desayuno en Ecuador: pan con [mantequilla], [queso] fresco y un [café] sin [azúcar]. La dueña prefiere [té]. Para los huevos usa un poco de [aceite] y [sal].","Breakfast in Ecuador: bread with butter, fresh cheese and a coffee without sugar. The owner prefers tea. For the eggs she uses a little oil and salt.",["café","té","azúcar","sal","queso","aceite","mantequilla"]],[79,"Tres comidas","Después del [desayuno], Daniel camina todo el día. Para el [almuerzo] come [sopa] y [pollo] con [ensalada]. Por la noche tiene mucha [hambre] otra vez. La [cena] es simple: pan y una [cerveza] fría.","After breakfast, Daniel walks all day. For lunch he eats soup and chicken with salad. In the evening he's very hungry again. Dinner is simple: bread and a cold beer.",["pollo","sopa","ensalada","cerveza","desayuno","almuerzo","cena","hambre"]],[80,"La granjera","La granjera [cuida|cuidar] una [yegua] y su potro. También [cose|coser] ropa y [cuece|cocer] papas en una olla grande. —¿Cuánto [cuesta|costar] la leche? —pregunta Daniel. —Para ti, nada. Te la [doy|dar]. Daniel no lo [cree|creer]: ¡qué amable!","The farmer looks after a mare and her foal. She also sews clothes and boils potatoes in a big pot. 'How much does the milk cost?' asks Daniel. 'For you, nothing. I'll give it to you.' Daniel can't believe it: how kind!",["yegua","cocer","coser","costar","creer","cuidar","dar"]],[81,"La cuenta, por favor","En el [restaurante], Daniel pide el [menú]. Pide un [plato] de ceviche y una [botella] de agua. Le falta una [cuchara] y un [cuchillo]. Al final toma una [taza] de café y pide la [cuenta].","At the restaurant, Daniel asks for the menu. He orders a plate of ceviche and a bottle of water. He's missing a spoon and a knife. At the end he has a cup of coffee and asks for the bill.",["restaurante","menú","cuenta","plato","cuchara","cuchillo","taza","botella"]],[82,"El mercado de Quito","En el mercado de Quito hay de todo: [lechuga], [zanahoria], [ajo], [maíz] de muchos colores y [frijoles] negros. Daniel compra un [aguacate] y una [piña]. Para el ceviche necesita [limón].","At the Quito market there's everything: lettuce, carrots, garlic, corn of many colours and black beans. Daniel buys an avocado and a pineapple. For the ceviche he needs lime.",["lechuga","zanahoria","ajo","limón","piña","aguacate","maíz","frijoles"]],[83,"Domingo sin cocinar","Es domingo y Daniel no quiere cocinar. Come una [hamburguesa] y un [refresco]. Por la tarde, un [helado] de [chocolate]. Por la noche sus amigos piden [pizza]. —¡En México comíamos [tortilla] con todo! —ríe Daniel. De postre hay [pastel] y una [galleta].","It's Sunday and Daniel doesn't want to cook. He eats a hamburger and a soft drink. In the afternoon, a chocolate ice cream. In the evening his friends order pizza. 'In Mexico we ate tortillas with everything!' laughs Daniel. For dessert there's cake and a biscuit.",["galleta","pastel","helado","chocolate","tortilla","refresco","hamburguesa","pizza"]],[84,"A Lima","Daniel [desayuna|desayunar] temprano: su avión a Lima [despega|despegar] a las nueve. En el aeropuerto le piden [deletrear] su nombre: D-A-N-I-E-L. Un hombre [denuncia|denunciar] el robo de su maleta. Daniel no [dice|decir] nada y espera. Las paredes están [decoradas|decorar] con fotos de volcanes. En el avión, por fin, [descansa|descansar].","Daniel has breakfast early: his plane to Lima takes off at nine. At the airport they ask him to spell his name: D-A-N-I-E-L. A man reports that his suitcase was stolen. Daniel says nothing and waits. The walls are decorated with photos of volcanoes. On the plane, at last, he rests.",["decir","deletrear","decorar","denunciar","desayunar","despegar","descansar"]],[85,"La capital de la comida","Lima es la capital de la comida. Daniel prueba todo. El ceviche tiene un [sabor] fresco y un poco [picante]. La chicha morada es [dulce]. El café es [amargo]. Las papas fritas están [saladas|salado] y le dan [sed]. En la calle hay un [olor] [rico] a pan.","Lima is the food capital. Daniel tries everything. The ceviche has a fresh, slightly spicy flavour. Chicha morada is sweet. The coffee is bitter. The fries are salty and make him thirsty. In the street there's a delicious smell of bread.",["sed","sabor","olor","picante","dulce","salado","rico","amargo"]],[86,"Barranco","Daniel vive en Barranco, un [barrio] bohemio. Para ir al [centro] toma la [carretera] de la costa. En el [camino] cruza un [puente] de madera muy famoso. En la [esquina] hay una [plaza] pequeña con árboles. Es su [lugar] favorito.","Daniel lives in Barranco, a bohemian neighbourhood. To go to the centre he takes the coastal road. On the way he crosses a very famous wooden bridge. On the corner there's a small square with trees. It's his favourite place.",["lugar","plaza","centro","barrio","camino","carretera","puente","esquina"]],[87,"¿Coche o carro?","Daniel quiere ir a Cusco. Puede ir en [avión], en autobús o en [carro]. —En España dicen [coche] —dice su amigo peruano. Daniel compra un [boleto] de autobús y muestra su [pasaporte]. Después, desde Cusco, va a tomar el [tren] a Machu Picchu. Y en el lago Titicaca, un [barco]. En Lima solo usa la [bicicleta].","Daniel wants to go to Cusco. He can go by plane, by bus or by car. 'In Spain they say coche,' says his Peruvian friend. Daniel buys a bus ticket and shows his passport. Later, from Cusco, he's going to take the train to Machu Picchu. And on Lake Titicaca, a boat. In Lima he only uses his bicycle.",["avión","tren","coche","carro","barco","bicicleta","boleto","pasaporte"]],[88,"Compañeros de viaje","En el autobús a Cusco, Daniel conoce a muchas personas: una [profesora] de inglés, un [bombero], un [empresario] con traje y una [carnicera] del mercado de Lima. Hay también una [periodista] que escribe un artículo. Un hombre dice que es [plomero]. —En España dicen [fontanero] —explica la profesora.","On the bus to Cusco, Daniel meets lots of people: an English teacher, a firefighter, a businessman in a suit and a butcher from the Lima market. There's also a journalist writing an article. A man says he's a plumber. 'In Spain they say fontanero,' the teacher explains.",["profesora","bombero","empresario","carnicera","fontanero","plomero","periodista"]],[89,"Cusco","El [viaje] dura veinte horas. En Cusco, Daniel deja la [maleta] en el [hotel]. Cambia dinero en el [banco]. Visita una [iglesia] antigua y un [museo] inca. En una [tienda] compra un mapa: la [frontera] con Bolivia no está lejos.","The trip lasts twenty hours. In Cusco, Daniel leaves his suitcase at the hotel. He changes money at the bank. He visits an old church and an Inca museum. In a shop he buys a map: the border with Bolivia isn't far.",["viaje","hotel","maleta","frontera","museo","iglesia","banco","tienda"]],[90,"La escuela de español","En Cusco, Daniel toma [clase] en una [escuela] de español. Su profesor también enseña en la [universidad]. El viernes hay un [examen]. Daniel tiene que hacer su [trabajo] por internet: su [empresa] tiene una [reunión] a las tres. Usa la [oficina] de la escuela.","In Cusco, Daniel takes classes at a Spanish school. His teacher also teaches at the university. On Friday there's an exam. Daniel has to do his work online: his company has a meeting at three. He uses the school office.",["escuela","universidad","clase","examen","oficina","trabajo","empresa","reunión"]],[91,"Perú tiene de todo","Perú tiene de todo. En la costa hay [mar] y [desierto]. En el centro, [montaña] y [campo]. Al este, la [selva] y el [río] Amazonas. En el lago Titicaca hay una [isla] flotante. Y cerca de Machu Picchu, un [bosque] de nubes.","Peru has everything. On the coast there's sea and desert. In the middle, mountains and countryside. To the east, the jungle and the Amazon river. On Lake Titicaca there's a floating island. And near Machu Picchu, a cloud forest.",["mar","río","montaña","bosque","isla","campo","desierto","selva"]],[92,"Una noche sin dormir","En la escuela, la profesora [enseña|enseñar] palabras con juegos. Daniel tiene que [dibujar] una casa y [entregar] el dibujo. Por la noche no puede [dormir]. [Enciende|encender] la luz y [encuentra|encontrar] una foto de Lucía. Le [envía|enviar] un mensaje.","At school, the teacher teaches words with games. Daniel has to draw a house and hand in the drawing. At night he can't sleep. He turns on the light and finds a photo of Lucía. He sends her a message.",["dibujar","dormir","encender","encontrar","enseñar","entregar","enviar"]],[93,"Machu Picchu","En Machu Picchu, el [cielo] está gris. Primero hay [lluvia] y [viento]. Luego sale el [sol]. Por la noche, en el campamento, hacen un [fuego]. Ven la [luna] y mil [estrellas|estrella]. El guía dice: —Para los incas, la [tierra] era una madre.","At Machu Picchu, the sky is grey. First there's rain and wind. Then the sun comes out. At night, at the campsite, they make a fire. They see the moon and a thousand stars. The guide says: 'For the Incas, the earth was a mother.'",["cielo","sol","luna","estrella","lluvia","viento","tierra","fuego"]],[94,"La llama","De día hace [calor]; de noche, [frío]. El [aire] es fino a esa altura. Daniel ve una [planta] rara con una [hoja] enorme. Sobre una [piedra] hay un [insecto] azul. El único [animal] grande es una llama que lo mira.","By day it's hot; by night, cold. The air is thin at that altitude. Daniel sees a strange plant with an enormous leaf. On a stone there's a blue insect. The only large animal is a llama staring at him.",["calor","frío","aire","animal","planta","hoja","piedra","insecto"]],[95,"El misterio inca","El guía explica: —Los incas construían de una [manera] especial. Cada piedra tiene una [forma] diferente. En este [caso], no usaban cemento. Es una [cosa] increíble. Daniel pregunta: —¿Qué [tipo] de herramientas usaban? —De todos [modos|modo], en [parte] es un misterio. Al otro [lado] del río hay más ruinas.","The guide explains: 'The Incas built in a special way. Each stone has a different shape. In this case, they didn't use cement. It's an incredible thing.' Daniel asks: 'What kind of tools did they use?' 'In any case, it's partly a mystery.' On the other side of the river there are more ruins.",["cosa","parte","caso","forma","tipo","modo","manera","lado"]],[96,"Un regalo","Daniel [envuelve|envolver] un regalo para Andrés, que está en [Colombia]. Le [escribe|escribir] una nota. En el correo, [espera|esperar] media hora. Una señora [estornuda|estornudar] tres veces. Daniel [escucha|escuchar] a dos turistas: son de [Portugal].","Daniel wraps a present for Andrés, who is in Colombia. He writes him a note. At the post office, he waits half an hour. A woman sneezes three times. Daniel listens to two tourists: they're from Portugal.",["envolver","escribir","escuchar","esperar","estornudar","Portugal","Colombia"]],[97,"La exposición","En un museo de Lima, Daniel ve una exposición sobre la [guerra] y la [paz]. Hay fotos de la [vida] diaria y de la [muerte]. Una frase dice: «El [miedo] es una [mentira]; el [amor] es la [verdad]».","In a museum in Lima, Daniel sees an exhibition about war and peace. There are photos of daily life and of death. One sentence says: 'Fear is a lie; love is the truth.'",["vida","muerte","amor","guerra","paz","miedo","verdad","mentira"]],[98,"Ni idea","En clase, el [tema] de hoy es la [noticia] del día. La profesora hace una [pregunta]. Daniel no sabe la [respuesta]. —¿Un [ejemplo]? —pide. —Es una [cuestión] simple —dice ella—. ¿Cuál es el [nombre] del alcalde de Cusco? Daniel no tiene ni [idea].","In class, today's topic is the news of the day. The teacher asks a question. Daniel doesn't know the answer. 'An example?' he asks. 'It's a simple matter,' she says. 'What's the name of the mayor of Cusco?' Daniel has no idea.",["nombre","idea","pregunta","respuesta","ejemplo","cuestión","tema","noticia"]],[99,"La manta","Daniel cuenta su [dinero]. Gasta la [mitad] en el hotel y el [resto] en comida. En el mercado pregunta el [precio] de una manta. Es una [cantidad] grande, pero tiene mucho [valor]: está hecha a mano. Paga con [tarjeta] y escribe su [número] de teléfono para el recibo.","Daniel counts his money. He spends half on the hotel and the rest on food. At the market he asks the price of a blanket. It's a large amount, but it's very valuable: it's handmade. He pays by card and writes his phone number for the receipt.",["dinero","precio","número","cantidad","valor","mitad","resto","tarjeta"]],[100,"El concurso","En la [biblioteca] de Cusco, Daniel tiene que [firmar] un papel para entrar. Está prohibido [fumar]. Por la tarde, aprende a [freír] papas en la escuela. Su grupo [gana|ganar] el concurso de cocina.","At the library in Cusco, Daniel has to sign a paper to get in. Smoking is forbidden. In the afternoon, he learns to fry potatoes at school. His group wins the cooking competition.",["biblioteca","firmar","freír","fumar","ganar"]],[101,"El partido","El [fútbol] es el [deporte] favorito de Perú. Esta noche hay un [partido] importante. Todos llevan la camiseta del [equipo]. En el bar hay [música] y cantan una [canción] famosa. Para Daniel es como una [película]. Pierden, pero dicen: —Es solo un [juego].","Football is Peru's favourite sport. Tonight there's an important match. Everyone wears the team shirt. In the bar there's music and they sing a famous song. For Daniel it's like a film. They lose, but they say: 'It's only a game.'",["juego","deporte","fútbol","partido","equipo","música","canción","película"]],[102,"Leer en español","Daniel lee mucho en español. Empieza con un [cuento] corto, luego una [revista] y el [periódico]. Ahora lee una [novela] de Vargas Llosa. En la [pantalla] del celular recibe un [mensaje] de Lucía con una [imagen]: ella sale en un [programa] de televisión.","Daniel reads a lot in Spanish. He starts with a short story, then a magazine and the newspaper. Now he's reading a Vargas Llosa novel. On his phone screen he gets a message from Lucía with an image: she's on a television programme.",["novela","cuento","periódico","revista","programa","pantalla","imagen","mensaje"]],[103,"El proyecto de Lucía","Lucía trabaja en un [proyecto] de educación. Su [grupo] quiere mejorar el [sistema] de escuelas en los pueblos. Explica el [plan]: más [información] y un mejor [servicio] de internet. —La educación es un [derecho] —dice en el programa.","Lucía works on an education project. Her group wants to improve the school system in the villages. She explains the plan: more information and a better internet service. 'Education is a right,' she says on the programme.",["derecho","sistema","servicio","grupo","proyecto","plan","información"]],[104,"Pan en el horno","En la cocina de la escuela, el profesor [grita|gritar]: —¡El agua tiene que [hervir]! Hoy van a [hacer] pan. Lo van a [hornear] en un horno de barro. Daniel no quiere [gastar] mucha harina.","In the school kitchen, the teacher shouts: 'The water has to boil!' Today they're going to make bread. They're going to bake it in a clay oven. Daniel doesn't want to use up much flour.",["gritar","gastar","hacer","hornear","hervir"]],[105,"Una sorpresa","Lucía llama a Daniel: —Tengo una [sorpresa]: ¡voy a Cusco! Daniel está nervioso. ¿Es una [cita]? ¿Es el principio de una [relación]? Le compra un [regalo]. Cuando llega, ella le da un [beso] en la mejilla. —¿Cómo fue la [boda] de la hermana de Andrés? —pregunta. Después dice: —Hazme un [favor]: llévame al mercado.","Lucía calls Daniel: 'I have a surprise: I'm coming to Cusco!' Daniel is nervous. Is it a date? Is it the beginning of a relationship? He buys her a present. When she arrives, she gives him a kiss on the cheek. 'How was the wedding of Andrés's sister?' she asks. Then she says: 'Do me a favour: take me to the market.'",["relación","boda","regalo","sorpresa","beso","cita","favor"]],[106,"Tres días","Pasan tres días juntos. Daniel siente [alegría] y, al final, [tristeza]: Lucía vuelve a México. ¿Fue un [error] no decir nada? No es [culpa] de nadie. —Ten [cuidado] en el viaje —dice ella—. Y buena [suerte]. Daniel no entiende bien su [sentimiento]. Todo tiene [sentido] y nada tiene sentido.","They spend three days together. Daniel feels joy and, at the end, sadness: Lucía is going back to Mexico. Was it a mistake to say nothing? It's nobody's fault. 'Be careful on your trip,' she says. 'And good luck.' Daniel doesn't fully understand his feeling. Everything makes sense and nothing makes sense.",["sentido","sentimiento","alegría","tristeza","suerte","error","cuidado","culpa"]],[107,"En el aeropuerto","En el aeropuerto, Lucía busca la [entrada]. La [salida] de su vuelo es a las cuatro. —¿Y la [llegada] a México? —A las once. Daniel la acompaña hasta el [final] del pasillo. Ella da un [paso], se da la [vuelta] y dice: —Te escribo mi [dirección]. Para tu [regreso].","At the airport, Lucía looks for the entrance. Her flight's departure is at four. 'And arrival in Mexico?' 'At eleven.' Daniel walks with her to the end of the corridor. She takes a step, turns around and says: 'I'll write you my address. For when you come back.'",["final","salida","entrada","paso","vuelta","llegada","regreso","dirección"]],[108,"Decir adiós","Daniel es [tímido], pero con Lucía no. Ella es [alegre], [divertida|divertido] y [amable]. Hablar con ella es [fácil]. Decir adiós es [difícil]. Está [nervioso] toda la tarde.","Daniel is shy, but not with Lucía. She's cheerful, fun and kind. Talking to her is easy. Saying goodbye is hard. He's nervous all afternoon.",["tímido","nervioso","alegre","divertido","amable","difícil","fácil"]],[109,"Un mensaje de voz","Esa noche hay mucho [silencio] en el hostal. Daniel escucha el [sonido] de la lluvia y el [ruido] de un autobús lejos. Escucha un mensaje de Lucía: su [voz] es tranquila. Ella habla en [español], después en [inglés], y al final dice una palabra en [hebreo]: «Shalom».","That night it's very quiet in the hostel. Daniel hears the sound of the rain and the noise of a bus far away. He listens to a message from Lucía: her voice is calm. She speaks in Spanish, then in English, and at the end says a word in Hebrew: 'Shalom.'",["español","inglés","hebreo","voz","sonido","ruido","silencio"]],[110,"Hacia Bolivia","Daniel quiere ir a Bolivia. El autobús es [viejo] y [pequeño], pero el conductor es [bueno]. La carretera es [mala|malo] y la montaña es muy [alta|alto]. El lago Titicaca es [grande] como un mar. Todo es [nuevo] para él.","Daniel wants to go to Bolivia. The bus is old and small, but the driver is good. The road is bad and the mountain is very high. Lake Titicaca is as big as a sea. Everything is new for him.",["bueno","malo","grande","pequeño","nuevo","viejo","alto"]],[111,"La frontera","El viaje es [largo]. El camino es [estrecho] y el río, [ancho]. En la frontera, Daniel lleva su maleta [pesada|pesado]. Un hombre [bajo] lo ayuda. A esa altura Daniel se siente [débil]. Solo come algo [ligero]. Por suerte, el último tramo es [corto].","The journey is long. The road is narrow and the river, wide. At the border, Daniel carries his heavy suitcase. A short man helps him. At that altitude Daniel feels weak. He only eats something light. Luckily, the last stretch is short.",["bajo","largo","corto","ancho","estrecho","débil","pesado","ligero"]],[112,"¿Vamos a llegar?","En el autobús hay una chica [asustada]: no le gusta la altura. Otra está [aburrida] y otra, [hambrienta]. La conductora está muy [concentrada]. Daniel está [cansado] y un poco [triste]. —¿Vamos a llegar pronto? —pregunta la chica. —[Eso espero] —dice Daniel.","On the bus there's a frightened girl: she doesn't like the altitude. Another is bored and another, hungry. The driver is very focused. Daniel is tired and a bit sad. 'Are we going to arrive soon?' asks the girl. 'I hope so,' says Daniel.",["eso espero","asustada","concentrada","aburrida","cansado","hambrienta","triste"]],[113,"La Paz","La Paz es [bonita|bonito], aunque algunos barrios son [feos|feo]. El aire es [fresco]. El hostal está [limpio], pero la ropa de Daniel está [sucia|sucio]. Una señora le dice: —¡Qué [guapo]! Te lavo la ropa con agua [caliente]. Ese [lindo] gesto le alegra el día.","La Paz is pretty, although some neighbourhoods are ugly. The air is fresh. The hostel is clean, but Daniel's clothes are dirty. A lady tells him: 'How handsome! I'll wash your clothes in hot water.' That lovely gesture makes his day.",["bonito","feo","guapo","lindo","limpio","sucio","caliente","fresco"]],[114,"¿Es posible?","En La Paz hay teleférico. Es [rápido] y [seguro]. El autobús es [lento]. —¿Es [posible] ir al salar de Uyuni en un día? —Es [imposible] —dice el guía—. Es [necesario] ir tres días. Y es [importante] llevar ropa de invierno. —¿Es [cierto] que hace mucho frío? —Sí.","In La Paz there's a cable car. It's fast and safe. The bus is slow. 'Is it possible to go to the Uyuni salt flat in one day?' 'It's impossible,' says the guide. 'You need to go for three days. And it's important to bring winter clothes.' 'Is it true that it's very cold?' 'Yes.'",["rápido","lento","importante","necesario","posible","imposible","cierto","seguro"]],[115,"El salar","El primer día, el guía está [ocupado] y un poco [enojado]: el carro no arranca. Los turistas están [preocupados|preocupado]. Al final arreglan el carro. —¡[Listos|listo]! —grita el guía, ya [contento]. En el salar, Daniel está [tranquilo] y [feliz]. Se siente [libre].","On the first day, the guide is busy and a bit angry: the car won't start. The tourists are worried. In the end they fix the car. 'Ready!' shouts the guide, happy now. On the salt flat, Daniel is calm and happy. He feels free.",["feliz","contento","enojado","ocupado","libre","tranquilo","preocupado","listo"]],[116,"Fotos divertidas","En el salar hay agua y todo está [mojado]. Hace [mucho] frío. Los turistas [intentan|intentar] hacer fotos divertidas. Uno finge [huir] de un dinosaurio de juguete. Otros [juegan|jugar] con la perspectiva. Es [muy] divertido. —¿Adónde vamos mañana? —Vamos a [ir] a las lagunas —dice el guía.","On the salt flat there's water and everything is wet. It's very cold. The tourists try to take funny photos. One pretends to flee from a toy dinosaur. Others play with perspective. It's very fun. 'Where are we going tomorrow?' 'We're going to go to the lagoons,' says the guide.",["mojado","muy","mucho","huir","intentar","ir","jugar"]],[117,"Un viaje único","Bolivia es un país [pobre], pero muy rico en cultura. La comida es [barata|barato] y los hoteles no son [caros|caro]. Cada pueblo es [diferente]; ninguno es [igual]. Cada uno tiene su [propia|propio] fiesta. La plaza [principal] siempre tiene una iglesia. Es un viaje [único].","Bolivia is a poor country, but very rich in culture. Food is cheap and hotels aren't expensive. Every town is different; none is the same. Each one has its own festival. The main square always has a church. It's a unique trip.",["pobre","caro","barato","diferente","igual","propio","principal","único"]],[118,"La mina","En Potosí, la mina está [abierta|abierto] a los turistas. El túnel está [vacío] y oscuro. El museo de la plata está [cerrado] los lunes. El guía cuenta la historia [real] de la mina: es [simple] y triste. —¿Es una historia [verdadera|verdadero]? —Sí, no es [falsa|falso]. Al salir, Daniel tiene el corazón [lleno].","In Potosí, the mine is open to tourists. The tunnel is empty and dark. The silver museum is closed on Mondays. The guide tells the real history of the mine: it's simple and sad. 'Is it a true story?' 'Yes, it's not false.' When he comes out, Daniel's heart is full.",["lleno","vacío","abierto","cerrado","verdadero","falso","real","simple"]],[119,"Sucre","La [próxima|próximo] ciudad es Sucre. Es una ciudad [antigua|antiguo], pero tiene cafés [modernos|moderno]. Su hostal [actual] es mejor que el [anterior]. En [general], los turistas prefieren La Paz, pero Sucre es [especial]. Hay una exposición [reciente] sobre dinosaurios.","The next city is Sucre. It's an old city, but it has modern cafés. His current hostel is better than the previous one. In general, tourists prefer La Paz, but Sucre is special. There's a recent exhibition about dinosaurs.",["próximo","anterior","antiguo","moderno","actual","reciente","general","especial"]],[120,"Un día de lluvia","Empieza a [llover]. Daniel se queda en el hostal. Tiene que [lavar] su ropa y [limpiar] sus zapatos. Después quiere [leer] su novela. En la cocina, una chica va a [licuar] fruta para un jugo. Un niño empieza a [llorar] cuando su papá [llega|llegar] tarde.","It starts to rain. Daniel stays at the hostel. He has to wash his clothes and clean his shoes. Then he wants to read his novel. In the kitchen, a girl is going to blend fruit for a juice. A boy starts to cry when his dad arrives late.",["lavar","leer","limpiar","licuar","llegar","llorar","llover"]],[121,"Las mantas","En el mercado de Sucre venden mantas de muchos colores: [rosa], [morado] y azul [oscuro]. Una manta [dorada|dorado] es muy [brillante]. Daniel toca la lana: es [suave]. El pan de la señora es [duro] y un poco [seco], pero delicioso.","At the Sucre market they sell blankets in many colours: pink, purple and dark blue. A golden blanket is very bright. Daniel touches the wool: it's soft. The lady's bread is hard and a bit dry, but delicious.",["rosa","morado","oscuro","dorado","brillante","suave","duro","seco"]],[122,"En el parque","En el parque [público] hay una manifestación [política|político]. La gente pide más justicia [social]. Hay un grupo [internacional] de estudiantes y un canal de televisión [nacional]. Una mujer [mayor] habla de los derechos [humanos|humano]. Su hermana [menor] traduce para los turistas.","In the public park there's a political demonstration. People are asking for more social justice. There's an international group of students and a national television channel. An older woman talks about human rights. Her younger sister translates for the tourists.",["humano","social","público","político","nacional","internacional","mayor","menor"]],[123,"Cualquier lugar","Daniel tiene [varios] días libres. —¿Vas a [algún|alguno] lugar? —pregunta el dueño. —No tengo [ningún|ninguno] plan. [Cualquier] lugar está bien. —Pues visita [ambos] lagos: el pequeño y el grande. —¿Es [tal] como dicen? —Mejor. Es [lo que] todos quieren ver. Daniel pasa el día [entero] en el barco.","Daniel has several days off. 'Are you going anywhere?' asks the owner. 'I don't have any plans. Any place is fine.' 'Well, visit both lakes: the small one and the big one.' 'Is it as they say?' 'Better. It's what everyone wants to see.' Daniel spends the whole day on the boat.",["entero","cualquier","varios","ambos","tal","alguno","ninguno","lo que"]],[124,"Los colores","Las banderas en la plaza tienen muchos colores: [rojo], [amarillo] y [verde] es la de Bolivia. El cielo es [azul] y las nubes son [blancas|blanco]. Un gato [negro] duerm
