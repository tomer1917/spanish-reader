e en un banco [gris]. Una niña come una [naranja].","The flags in the square have many colours: red, yellow and green is Bolivia's. The sky is blue and the clouds are white. A black cat sleeps on a grey bench. A girl eats an orange.",["naranja","rojo","verde","amarillo","negro","azul","blanco","gris"]],[125,"Dos hermanos","En el barco, Daniel conoce a dos hermanos. Uno es [simpático] y [gracioso]; el otro es [serio] y un poco [antipático]. El simpático dice: —Mi hermano es muy [inteligente], pero [perezoso]. —¡No soy [tonto]! —dice el serio. Al final, el serio salta al agua fría. —¡Qué [valiente]!","On the boat, Daniel meets two brothers. One is nice and funny; the other is serious and a bit unfriendly. The nice one says: 'My brother is very intelligent, but lazy.' 'I'm not stupid!' says the serious one. In the end, the serious one jumps into the cold water. 'How brave!'",["simpático","antipático","inteligente","tonto","perezoso","serio","gracioso","valiente"]],[126,"La Isla del Sol","La Isla del Sol es [famosa|famoso]. Muchos turistas [extranjeros|extranjero] la visitan. Daniel come un plato [típico]: trucha. Está [perfecto]. Un camino es [peligroso] y otro es [normal]. Por la noche, ve algo [raro]: una luz en el lago. ¡Es [increíble]!","Isla del Sol is famous. Many foreign tourists visit it. Daniel eats a typical dish: trout. It's perfect. One path is dangerous and the other is normal. At night, he sees something strange: a light on the lake. It's incredible!",["famoso","extranjero","peligroso","raro","normal","típico","perfecto","increíble"]],[127,"En la tienda","—¡[Buenos días]! —dice Daniel en la tienda. —[Hola]. —Un pan, [por favor]. —Aquí tiene. —[Gracias]. —[De nada]. Al salir choca con una señora. —¡Ay, [perdón]! [Lo siento]. —No pasa nada. Por la noche, en el hostal, dice a todos: —[Buenas noches].","'Good morning!' says Daniel in the shop. 'Hello.' 'A bread roll, please.' 'Here you are.' 'Thank you.' 'You're welcome.' On the way out he bumps into a lady. 'Oh, sorry! I'm sorry.' 'No problem.' At night, at the hostel, he says to everyone: 'Good night.'",["hola","gracias","por favor","de nada","perdón","lo siento","buenos días","buenas noches"]],[128,"El perro del hostal","En el hostal hay un perro [gordo] y [marrón] y un gato [delgado] y [beige]. El perro es muy [fuerte]. —¿Cuántos años tiene? —[Más o menos] diez. Es el [promedio] para un perro. [Unos turistas lo quieren y otros|unos y otros] le tienen miedo.","In the hostel there's a fat brown dog and a thin beige cat. The dog is very strong. 'How old is he?' 'More or less ten. That's the average for a dog.' Some tourists love him and others are afraid of him.",["marrón","beige","fuerte","gordo","delgado","promedio","unos y otros","más o menos"]],[129,"Buenos Aires","Daniel llega a Argentina. En el hostal conoce a Sofía. —Hola, soy Daniel. —[Mucho gusto]. ¿[Qué tal] el viaje? —Largo. [Oye], ¿me ayudas con el mapa? —[Claro que sí]. [Mira], aquí está el centro. Es el cumpleaños de Daniel. —¡[Felicidades]! —dice Sofía—. [Ojalá] te guste Buenos Aires.","Daniel arrives in Argentina. At the hostel he meets Sofía. 'Hi, I'm Daniel.' 'Nice to meet you. How was the trip?' 'Long. Hey, can you help me with the map?' 'Of course. Look, here's the centre.' It's Daniel's birthday. 'Congratulations!' says Sofía. 'I hope you like Buenos Aires.'",["claro que sí","oye","mira","ojalá","felicidades","qué tal","mucho gusto"]],[130,"El mapa de la ciudad","Buenos Aires es enorme. Sofía dibuja una [línea] en el mapa. —Este es el [punto] de partida. Esta [zona] es Palermo, un [sitio] con muchos parques. Allí hay mucho [espacio] verde. Al [borde] de la ciudad está el río. —¿Y la [región] de la Patagonia? —Muy lejos, al sur. El [nivel] de español de Daniel ya es bueno: entiende casi todo.","Buenos Aires is huge. Sofía draws a line on the map. 'This is the starting point. This area is Palermo, a place with lots of parks. There's lots of green space there. At the edge of the city is the river.' 'And the Patagonia region?' 'Very far, to the south.' Daniel's Spanish level is already good: he understands almost everything.",["sitio","espacio","punto","nivel","zona","región","borde","línea"]],[131,"El río como un mar","En la [orilla] del Río de la Plata, Daniel mira el [horizonte]. La [vista] es increíble: el río es tan ancho que parece el mar. En la [superficie] del agua brilla el sol. Al [fondo], muy lejos, está Uruguay. Después visitan un café antiguo. El [exterior] es simple, pero el [interior] es elegante. Se sientan en un [rincón] tranquilo.","On the shore of the Río de la Plata, Daniel looks at the horizon. The view is incredible: the river is so wide it looks like the sea. The sun shines on the surface of the water. In the background, very far away, is Uruguay. Then they visit an old café. The outside is simple, but the inside is elegant. They sit in a quiet corner.",["fondo","superficie","interior","exterior","rincón","orilla","vista","horizonte"]],[132,"La receta de la abuela","Sofía [vive|vivir] cerca de un [lago] en el sur, pero ahora está en la capital. Le [muestra|mostrar] a Daniel una receta de su abuela. —Primero [mezclas|mezclar] la [papa] con queso. Después [cuelas|colar] el caldo. —¡Me [muero|morir] de hambre! —dice Daniel. —Entonces vamos a [pedir] empanadas.","Sofía lives near a lake in the south, but now she's in the capital. She shows Daniel a recipe from her grandmother. 'First you mix the potato with cheese. Then you strain the broth.' 'I'm starving!' says Daniel. 'Then let's order empanadas.'",["papa","lago","pedir","morir","vivir","mezclar","mostrar","colar"]],[133,"Un sueño","Esa noche Daniel tiene un [sueño] raro: Lucía está en Buenos Aires. Al despertar, tiene una [duda] en la [mente]. Busca en su [memoria] cada palabra de ella. Su [deseo] es volver a verla. Tiene una pequeña [esperanza]. Escribe un [pensamiento] en su cuaderno: «El [alma] sabe lo que quiere».","That night Daniel has a strange dream: Lucía is in Buenos Aires. When he wakes up, he has a doubt in his mind. He searches his memory for every word of hers. His wish is to see her again. He has a small hope. He writes a thought in his notebook: 'The soul knows what it wants.'",["pensamiento","memoria","mente","alma","sueño","esperanza","deseo","duda"]],[134,"El resultado","Daniel piensa en su viaje. El [objetivo] era hablar español. ¿El [resultado]? Un gran [éxito]. Hubo un pequeño [fracaso] en Bogotá, cuando estuvo enfermo, pero la [causa] fue el agua. El [efecto] del viaje es un [cambio] en su vida. ¿Y el [motivo] para seguir? Lucía.","Daniel thinks about his trip. The goal was to speak Spanish. The result? A great success. There was a small failure in Bogotá, when he was sick, but the cause was the water. The effect of the trip is a change in his life. And the reason to keep going? Lucía.",["cambio","resultado","causa","efecto","motivo","objetivo","éxito","fracaso"]],[135,"El negocio de Sofía","Sofía tiene un [negocio]: vende mate y otros [productos|producto] argentinos. —La [economía] está difícil —explica—. Las [ventas|venta] bajan, pero los clientes fieles siguen. Su [horario] es largo: de nueve a nueve. Su hermano trabaja con ella, y con su [sueldo] paga la universidad. Daniel hace una [compra]: un mate de regalo. El [pago] es en efectivo.","Sofía has a business: she sells mate and other Argentine products. 'The economy is difficult,' she explains. 'Sales are going down, but loyal customers keep coming.' Her hours are long: from nine to nine. Her brother works with her, and with his salary he pays for university. Daniel makes a purchase: a mate as a gift. Payment is in cash.",["negocio","economía","producto","compra","venta","pago","sueldo","horario"]],[136,"Domingo en el parque","El domingo, Sofía [organiza|organizar] un día en el parque. Unos niños [patinan|patinar], otros [patean|patear] una pelota. Dos perros [pelean|pelear] por un palo. En el lago, un señor [pesca|pescar] y unos chicos [nadan|nadar]. Daniel cierra los ojos para [oír] los pájaros. [Piensa|pensar] en Lucía.","On Sunday, Sofía organises a day in the park. Some children skate, others kick a ball. Two dogs fight over a stick. On the lake, a man fishes and some boys swim. Daniel closes his eyes to hear the birds. He thinks about Lucía.",["nadar","oír","organizar","patinar","patear","pensar","pelear","pescar"]],[137,"Sin batería","El celular de Daniel no tiene [batería]. Cuando lo carga, la [red] del hostal no funciona. —¿Cuál es la [contraseña]? —pregunta. Por fin lee su [correo]. Lucía le manda un [dato] interesante: trabaja en una [aplicación] para aprender [ciencia] en las escuelas. Explica la [técnica]: juegos y videos.","Daniel's phone has no battery. When he charges it, the hostel network doesn't work. 'What's the password?' he asks. Finally he reads his email. Lucía sends him an interesting fact: she's working on an app for learning science in schools. She explains the technique: games and videos.",["ciencia","técnica","dato","red","correo","aplicación","contraseña","batería"]],[138,"La ciudad de los edificios","En Buenos Aires hay de todo. El [apartamento] de Sofía está en un [edificio] antiguo con un [patio] interior y un [jardín]. Desde una [torre] se ve toda la ciudad. Visitan una [cárcel] vieja que ahora es un museo, y una casa grande como un [castillo]. Fuera de la ciudad, Sofía tiene familia en una [granja].","In Buenos Aires there's everything. Sofía's apartment is in an old building with an inner courtyard and a garden. From a tower you can see the whole city. They visit an old prison that's now a museum, and a house as big as a castle. Outside the city, Sofía has family on a farm.",["granja","jardín","patio","edificio","apartamento","torre","castillo","cárcel"]],[139,"El ladrón","En la calle, un [ladrón] intenta llevarse la mochila de un turista. —¡[Ayuda]! —grita el turista. Daniel llama al número de [emergencia]. Llega la policía. Por suerte no hay [peligro]: nadie está herido y no hay ningún [accidente]. El policía escribe el informe del [robo] y dice: —La [seguridad] es lo primero: cuidado con el celular.","In the street, a thief tries to grab a tourist's backpack. 'Help!' shouts the tourist. Daniel calls the emergency number. The police arrive. Luckily there's no danger: nobody is hurt and there's no accident. The officer writes the report of the robbery and says: 'Safety comes first: be careful with your phone.'",["peligro","accidente","emergencia","ayuda","ladrón","robo","seguridad"]],[140,"Una semana","La [semana] de Daniel en Buenos Aires: el [lunes], tango. El [martes], museos. El [miércoles], fútbol. El [jueves], asado con Sofía. El [viernes], teatro. El [domingo] compra un boleto... a México.","Daniel's week in Buenos Aires: on Monday, tango. On Tuesday, museums. On Wednesday, football. On Thursday, a barbecue with Sofía. On Friday, theatre. On Sunday he buys a ticket... to Mexico.",["lunes","martes","miércoles","jueves","viernes","domingo","semana"]],[141,"La cena de despedida","Sofía invita a Daniel a cenar en su casa. La [sala] tiene una [alfombra] roja y una [lámpara] antigua. En el [comedor] hay una mesa larga. Hace frío y prenden la [estufa]. Daniel saca el postre de la [nevera]. Antes de salir, se mira en el [espejo]. En el [dormitorio] de invitados duerme el gato.","Sofía invites Daniel to dinner at her place. The living room has a red rug and an old lamp. In the dining room there's a long table. It's cold and they turn on the heater. Daniel takes the dessert out of the fridge. Before leaving, he looks at himself in the mirror. In the guest bedroom the cat is sleeping.",["dormitorio","sala","comedor","espejo","lámpara","alfombra","nevera","estufa"]],[142,"La maleta para México","Daniel prepara la maleta para México. Lleva una [chaqueta], un [abrigo] para el avión, [calcetines] limpios y un [cinturón]. Busca sus [lentes] de sol. —En España dicen [gafas] —ríe Sofía. Ella le regala una [gorra] de su equipo. Para Lucía, Daniel compró una [falda] de colores.","Daniel packs his suitcase for Mexico. He takes a jacket, a coat for the plane, clean socks and a belt. He looks for his sunglasses. 'In Spain they say gafas,' laughs Sofía. She gives him a cap from her team. For Lucía, Daniel bought a colourful skirt.",["chaqueta","abrigo","falda","calcetines","cinturón","gafas","lentes","gorra"]],[143,"Una oportunidad","En el avión, Daniel lee un correo: tiene una [entrevista] para un [puesto] en México. Es una gran [oportunidad]. Necesitan [experiencia] y un [título] universitario. Daniel tiene las dos cosas. Su [tarea]: preparar una presentación en español. ¿Empieza una nueva [carrera]?","On the plane, Daniel reads an email: he has an interview for a job in Mexico. It's a great opportunity. They need experience and a university degree. Daniel has both. His task: prepare a presentation in Spanish. Is a new career beginning?",["carrera","título","experiencia","entrevista","puesto","tarea","oportunidad"]],[144,"Fruta en el aeropuerto","Lucía lo espera en el aeropuerto con una caja de fruta: [uvas], [fresas|fresa] y [moras azules|mora azul]. —Es para el [fin de semana] —dice—. Vamos al campo. El [paisaje] es precioso. Mi mamá va a cocinar [pimientos] rellenos.","Lucía waits for him at the airport with a box of fruit: grapes, strawberries and blueberries. 'It's for the weekend,' she says. 'We're going to the countryside. The landscape is beautiful. My mum is going to cook stuffed peppers.'",["fin de semana","uvas","fresa","mora azul","paisaje","pimientos"]],[145,"El rancho","En el rancho de la familia de Lucía hay muchos animales: una [gallina], un [pato], una [oveja] y un perro que es la [mascota] de todos. Por la noche, un [ratón] corre por la cocina. El niño del vecino cuenta historias de un [lobo], un [oso] y un [mono] que viven en el bosque.","At Lucía's family ranch there are lots of animals: a hen, a duck, a sheep and a dog that is everyone's pet. At night, a mouse runs across the kitchen. The neighbour's boy tells stories about a wolf, a bear and a monkey that live in the forest.",["mascota","ratón","pato","gallina","oveja","mono","oso","lobo"]],[146,"Animales del viaje","Daniel cuenta su viaje: —En la selva vi una [serpiente] y una [araña] enorme. Los [mosquitos|mosquito] me comieron vivo. En la costa vi una [tortuga] y, desde el barco, una [ballena]. —¿Y un [tiburón]? —No, por suerte. El niño pregunta: —¿Y un [elefante]? —No, en América no hay. Una [mosca] entra en la cocina y todos ríen.","Daniel tells about his trip: 'In the jungle I saw a snake and an enormous spider. The mosquitoes ate me alive. On the coast I saw a turtle and, from the boat, a whale.' 'And a shark?' 'No, luckily.' The boy asks: 'And an elephant?' 'No, there aren't any in the Americas.' A fly comes into the kitchen and everyone laughs.",["serpiente","araña","mosca","mosquito","tortuga","tiburón","ballena","elefante"]],[147,"¿Dónde está la oficina?","El lunes es la entrevista. Daniel pregunta en la calle: —¿Dónde está la oficina? —Siga [recto] dos [cuadras|cuadra], luego a la [derecha] y después a la [izquierda]. Está en el [norte] de la ciudad, no en el [sur]. Si ve el parque al [oeste], ya llegó.","On Monday is the interview. Daniel asks in the street: 'Where is the office?' 'Go straight for two blocks, then right and then left. It's in the north of the city, not the south. If you see the park to the west, you've arrived.'",["derecha","izquierda","recto","norte","sur","oeste","cuadra"]],[148,"La cebolla","Antes de la entrevista, Daniel cocina con Lucía. Ella saca [plátanos] del [refri]. Él tiene que [picar] una [cebolla]. —¿Lloras? —Es la cebolla... y [lo mismo] me pasó en el [aeropuerto] cuando te fuiste.","Before the interview, Daniel cooks with Lucía. She takes plantains out of the fridge. He has to chop an onion. 'Are you crying?' 'It's the onion... and the same thing happened to me at the airport when you left.'",["lo mismo","refri","plátanos","aeropuerto","cebolla","picar"]],[149,"La entrevista","En la entrevista, Daniel habla [despacio]. [A veces] busca una palabra, pero [incluso] así habla bien. [De repente], la jefa pregunta: —¿Por qué México? —Porque aquí empezó todo. [Por eso] quiero volver. —¿Puede repetir, por favor? Daniel lo dice [otra vez]. —No contratamos a [cualquiera] —dice ella—. Pero usted es perfecto. Después, Lucía y Daniel celebran [juntos].","In the interview, Daniel speaks slowly. Sometimes he searches for a word, but even so he speaks well. Suddenly, the boss asks: 'Why Mexico?' 'Because everything started here. That's why I want to come back.' 'Can you repeat that, please?' Daniel says it again. 'We don't hire just anyone,' she says. 'But you're perfect.' Afterwards, Lucía and Daniel celebrate together.",["otra vez","a veces","de repente","por eso","cualquiera","juntos","despacio","incluso"]],[150,"La distancia","[Por fin] Daniel tiene trabajo en México. [Sin embargo], tiene que volver a Israel por un mes. [A pesar de] la distancia, Lucía y él hablan [a menudo]. [De hecho], hablan todos los días. Ella habla de su trabajo; él, [en cambio], habla de su familia. [Por ejemplo], le cuenta de su abuela. [Al final] de cada llamada, ella dice: «Pronto».","At last Daniel has a job in Mexico. However, he has to go back to Israel for a month. Despite the distance, he and Lucía talk often. In fact, they talk every day. She talks about her work; he, on the other hand, talks about his family. For example, he tells her about his grandmother. At the end of every call, she says: 'Soon.'",["sin embargo","por ejemplo","en cambio","a pesar de","por fin","de hecho","al final","a menudo"]],[151,"En casa","Daniel [acaba de|acabar de] llegar a Israel. [Tiene que|tener que] organizar la mudanza. —[Hay que] vender el carro —dice su papá. —No [hace falta] —dice Daniel—, mi hermano lo quiere. Su abuela le pide: —No [dejes de|dejar de] hablar hebreo. Daniel ríe: —[Voy a|ir a] [volver a] visitarte. [Realmente] te voy a extrañar.","Daniel has just arrived in Israel. He has to organise the move. 'We have to sell the car,' says his dad. 'There's no need,' says Daniel, 'my brother wants it.' His grandmother asks him: 'Don't stop speaking Hebrew.' Daniel laughs: 'I'm going to come and visit you again. I'm really going to miss you.'",["tener que","hay que","ir a","acabar de","volver a","dejar de","hace falta","realmente"]],[152,"Pintar la habitación","Daniel y su mamá van a [pintar] su vieja habitación. Él [plancha|planchar] su ropa y la [pone|poner] en la maleta. Su mamá [coloca|colocar] fotos en la pared. —Cuidado, no [pises|pisar] la pintura —dice ella. —Tranquila, mamá. [Puedo|poder] con todo.","Daniel and his mum are going to paint his old room. He irons his clothes and puts them in the suitcase. His mum hangs photos on the wall. 'Careful, don't step on the paint,' she says. 'Relax, mum. I can handle it all.'",["pintar","planchar","pisar","poner","colocar","poder"]],[153,"El último día","El último día en Israel, Daniel [tiene prisa|tener prisa]. [Tiene calor|tener calor] con el abrigo. En el aeropuerto [tiene hambre|tener hambre] y [tiene sed|tener sed]. En el avión [tiene frío|tener frío] y [tiene sueño|tener sueño], pero no puede dormir. ¿[Tiene miedo|tener miedo]? Un poco. Su abuela le escribe: «Vas a ser feliz». Ella siempre [tiene razón|tener razón].","On his last day in Israel, Daniel is in a hurry. He's hot in his coat. At the airport he's hungry and thirsty. On the plane he's cold and sleepy, but he can't sleep. Is he afraid? A little. His grandmother writes to him: 'You're going to be happy.' She's always right.",["tener hambre","tener sed","tener frío","tener calor","tener sueño","tener miedo","tener prisa","tener razón"]],[154,"La primera página","En el avión, Daniel [apenas] duerme. —[Con permiso] —dice para ir al baño. Al llegar a México, el piloto anuncia el tiempo: [hace sol] y [hace calor]. En Israel [hacía frío|hace frío] y [hacía viento|hace viento]. Aquí [está nublado] sobre las montañas, pero no importa. Lucía lo espera en la salida. [Aún] no lo sabe, pero esta es solo la primera página de su historia.","On the plane, Daniel barely sleeps. 'Excuse me,' he says to get to the bathroom. On landing in Mexico, the pilot announces the weather: it's sunny and hot. In Israel it was cold and windy. Here it's cloudy over the mountains, but it doesn't matter. Lucía is waiting for him at the exit. He doesn't know it yet, but this is only the first page of their story.",["hace frío","hace calor","hace sol","hace viento","está nublado","con permiso","apenas","aún"]]]};
const WORDS = DATA.words;     // [lemma, english, article, storyNumber, context]
const STORIES = DATA.stories; // [n, title, es (marked), en, [lemmas]]
const INT = [0, 1, 3, 7, 16, 35, 90];           // Leitner box -> days until next review
const KNOWN = 4;                                // box at which a word counts as known
const KEY = "cuento-del-dia-v1";
const MARK = /\[([^\]|]+)(?:\|([^\]]+))?\]/g;
const $ = id => document.getElementById(id);

/* ---------- lookups ---------- */
const BY_LEMMA = new Map(WORDS.map((w, i) => [w[0].toLowerCase(), i]));
const BY_SURFACE = new Map();
for (const s of STORIES) {
  for (const m of s[2].matchAll(MARK)) {
    const lemma = (m[2] || m[1]).trim().toLowerCase();
    const surf = m[1].trim().toLowerCase();
    if (BY_LEMMA.has(lemma) && !BY_SURFACE.has(surf)) BY_SURFACE.set(surf, BY_LEMMA.get(lemma));
  }
}
const lookup = t => { const k = t.toLowerCase(); return BY_LEMMA.has(k) ? BY_LEMMA.get(k) : BY_SURFACE.get(k); };
const label = w => (w[2] ? w[2] + " " : "") + w[0];
const BASE_N = WORDS.length;                    // words that come with a story; anything after is the user's own
const NEW_PER_DAY = 8;                          // own words released into review per day

/* ---------- state ---------- */
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
function fresh() { return { v: 1, idx: 0, w: {}, days: [], lastStory: null, custom: [], fed: [0, 0] }; }
let st = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

/* Own words live in st.custom as [es, en, article]. They are appended to WORDS so every
   view treats them like story words (with story 0 and no context sentence). When a later
   version of the app ships a story for one of them, the built-in entry wins and the
   review history carries over, because progress is keyed by the word itself. */
function syncCustom() {
  for (let i = WORDS.length - 1; i >= BASE_N; i--) BY_LEMMA.delete(WORDS[i][0].toLowerCase());
  WORDS.length = BASE_N;
  st.custom = (st.custom || []).filter(c => !BY_LEMMA.has(c[0].toLowerCase()));
  for (const c of st.custom) { BY_LEMMA.set(c[0].toLowerCase(), WORDS.length); WORDS.push([c[0], c[1], c[2] || "", 0, ""]); }
}
function feedNew() {
  const t = today();
  if (!Array.isArray(st.fed) || st.fed[0] !== t) st.fed = [t, 0];
  for (const c of st.custom) {
    if (st.fed[1] >= NEW_PER_DAY) break;
    if (!st.w[c[0]]) { st.w[c[0]] = [0, t]; st.fed[1] += 1; }
  }
  save();
}
const waiting = () => st.custom.filter(c => !st.w[c[0]]).length;

const SEPS = ["=", "\t", " — ", " – ", " -- ", " - ", " : ", ":", " | ", "|"];
function parseList(text) {
  let lines = text.split(/\r?\n/);
  if (lines.filter(l => l.trim()).length === 1 && text.includes(",")) lines = text.split(",");
  const out = [];
  for (const line of lines) {
    let l = line.trim().replace(/^[-•*•]\s*/, "").replace(/^\d+[.)]\s*/, "");
    if (!l) continue;
    let es = l, en = "";
    for (const s of SEPS) { const k = l.indexOf(s); if (k > 0) { es = l.slice(0, k).trim(); en = l.slice(k + s.length).trim(); break; } }
    es = es.replace(/^["'“”]+|["'“”,;.]+$/g, "").trim();
    let art = "";
    const m = es.match(/^(el|la|los|las)\s+(.+)$/i);
    if (m) { art = m[1].toLowerCase(); es = m[2]; }
    if (es) out.push([es, en, art]);
  }
  return out;
}
function addWords(text) {
  const r = { added: 0, known: 0, noMeaning: [] };
  for (const [es, en, art] of parseList(text)) {
    const k = es.toLowerCase();
    if (BY_LEMMA.has(k)) { r.known += 1; continue; }
    if (!en) { r.noMeaning.push(es); continue; }
    st.custom.push([es, en, art]);
    BY_LEMMA.set(k, WORDS.length); WORDS.push([es, en, art, 0, ""]);
    r.added += 1;
  }
  feedNew(); save();
  return r;
}
syncCustom(); feedNew();
function markActive() { const t = today(); if (!st.days.includes(t)) { st.days.push(t); if (st.days.length > 400) st.days = st.days.slice(-400); } }
function streak() {
  const set = new Set(st.days); let t = today(); if (!set.has(t)) t -= 1;
  let n = 0; while (set.has(t)) { n++; t--; } return n;
}
function due() {
  const t = today();
  return Object.entries(st.w).filter(([, v]) => v[1] <= t).sort((a, b) => a[1][1] - b[1][1]).map(([k]) => k);
}

/* ---------- speech ---------- */
let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  const pref = [/es[-_]MX/i, /es[-_]US/i, /es[-_]419/i, /es[-_](CO|AR|PE|CL)/i];
  for (const p of pref) { const hit = vs.find(v => p.test(v.lang)); if (hit) return hit; }
  return vs[0] || null;
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
function speak(text, rate = 0.92) {
  if (!("speechSynthesis" in window)) return toast("Este navegador no tiene voz.");
  voice = voice || pickVoice();
  if (!voice) return toast("No hay una voz en español instalada en este dispositivo.");
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice; u.lang = voice.lang; u.rate = rate;
    speechSynthesis.speak(u);
  } catch (e) { toast("No se pudo reproducir el audio aquí."); }
}
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- helpers ---------- */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function plain(es) { return es.replace(MARK, (_, a) => a); }
function renderMarked(es, host) {
  let last = 0;
  const pushText = s => {
    for (const part of s.split(/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)/)) {
      if (!part) continue;
      if (/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+$/.test(part)) { const sp = el("span", "w", part); sp.dataset.t = part; host.appendChild(sp); }
      else host.appendChild(document.createTextNode(part));
    }
  };
  for (const m of es.matchAll(MARK)) {
    pushText(es.slice(last, m.index));
    const sp = el("span", "m", m[1]);
    const i = BY_LEMMA.get((m[2] || m[1]).trim().toLowerCase());
    if (i != null) sp.dataset.i = i; else sp.dataset.t = m[1];
    host.appendChild(sp);
    last = m.index + m[0].length;
  }
  pushText(es.slice(last));
}
function renderCtx(ctx, host) {
  const parts = ctx.split(/[{}]/);
  parts.forEach((p, k) => host.appendChild(k % 2 ? el("b", null, p) : document.createTextNode(p)));
}

/* ---------- word sheet ---------- */
let sheetText = "";
function openSheet({ i, t }) {
  if (i != null) {
    const w = WORDS[i]; sheetText = w[0];
    const big = $("sheet-w"); big.textContent = "";
    if (w[2]) { big.appendChild(el("small", null, w[2] + " ")); }
    big.appendChild(document.createTextNode(w[0]));
    $("sheet-en").textContent = w[1];
    const s = st.w[w[0]];
    const where = w[3] ? "Aparece en el día " + w[3] : "Añadida por ti";
    $("sheet-note").textContent = s ? where + (s[0] >= KNOWN ? " · ya la sabes" : " · en repaso") : where + (w[3] ? "" : " · espera su turno en el repaso");
  } else {
    sheetText = t;
    $("sheet-w").textContent = t;
    $("sheet-en").textContent = "";
    $("sheet-note").textContent = "Esta forma no está en tu banco de palabras. Puedes escucharla igual.";
  }
  $("scrim").hidden = false; $("sheet").hidden = false;
  speak(sheetText);
  $("sheet-close").focus();
}
function closeSheet() { $("scrim").hidden = true; $("sheet").hidden = true; }
$("scrim").onclick = closeSheet;
$("sheet-close").onclick = closeSheet;
$("sheet-say").onclick = () => speak(sheetText);
$("sheet-slow").onclick = () => speak(sheetText, 0.55);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("click", e => {
  const t = e.target.closest(".story .m, .story .w");
  if (!t) return;
  if (t.dataset.i != null) return openSheet({ i: +t.dataset.i });
  const i = lookup(t.dataset.t);
  openSheet(i != null ? { i } : { t: t.dataset.t });
});

/* ---------- HOY ---------- */
let readingAhead = false, showTrans = false;
function viewHoy() {
  const v = $("v-hoy"); v.textContent = "";
  if (st.idx >= STORIES.length) {
    const e = el("div", "empty"); e.appendChild(el("div", "glyph", "¡Fin!"));
    e.appendChild(el("p", null, "Leíste los " + STORIES.length + " cuentos. Sigue con el repaso cada día para no olvidar."));
    const w = waiting();
    e.appendChild(el("p", null, w
      ? "Tienes " + w + " palabras tuyas esperando. Entran al repaso de " + NEW_PER_DAY + " en " + NEW_PER_DAY + " cada día."
      : "Añade las palabras de tus próximas clases y entrarán al repaso, " + NEW_PER_DAY + " por día."));
    const b = el("button", "btn", "Añadir palabras"); b.onclick = () => { show("palabras"); setTimeout(() => { const t = $("addwords"); if (t) { t.scrollIntoView({ block: "center" }); t.focus(); } }, 50); };
    e.appendChild(b);
    v.appendChild(e); return;
  }
  const finishedToday = st.lastStory === today() && !readingAhead;
  if (finishedToday) {
    const prev = STORIES[st.idx - 1];
    const box = el("div", "donebox");
    box.appendChild(el("div", "eyebrow", "Día " + prev[0] + " terminado"));
    box.appendChild(el("h2", null, "Listo por hoy."));
    box.appendChild(el("p", "sub", prev[4].length + " palabras nuevas entran al repaso desde mañana. Mañana te espera el día " + (prev[0] + 1) + "."));
    const r = el("div", "row"); r.style.marginTop = "16px";
    const ahead = el("button", "btn ghost", "Leer el siguiente");
    ahead.onclick = () => { readingAhead = true; showTrans = false; viewHoy(); };
    r.append(ahead); box.appendChild(r);
    v.appendChild(box);
    const d = due().length;
    if (d) {
      const p = el("p", "sub", ""); p.style.marginTop = "18px";
      p.textContent = "Tienes " + d + (d === 1 ? " palabra" : " palabras") + " para repasar.";
      const go = el("button", "btn small", "Ir al repaso"); go.style.marginLeft = "10px"; go.onclick = () => show("repaso");
      p.appendChild(go); v.appendChild(p);
    }
    return;
  }

  const s = STORIES[st.idx];
  v.appendChild(el("div", "eyebrow", "Día " + s[0] + " de " + STORIES.length));
  v.appendChild(el("h1", null, s[1]));
  const meta = el("div", "meta");
  meta.appendChild(el("span", "chip", s[4].length + " palabras nuevas"));
  const listen = el("button", "btn small", "Escuchar el cuento");
  listen.onclick = () => speak(plain(s[2]), 0.88);
  const slow = el("button", "btn ghost small", "Despacio");
  slow.onclick = () => speak(plain(s[2]), 0.65);
  meta.append(listen, slow);
  v.appendChild(meta);

  const p = el("p", "story"); renderMarked(s[2], p); v.appendChild(p);
  if (st.idx < 3) v.appendChild(el("p", "hint", "Toca cualquier palabra para ver qué significa y escucharla. Las palabras resaltadas son las nuevas de hoy."));

  if (!showTrans) {
    const b = el("button", "btn ghost", "Mostrar traducción");
    b.onclick = () => { showTrans = true; viewHoy(); };
    const r = el("div", "row"); r.style.marginBottom = "24px"; r.appendChild(b); v.appendChild(r);
  } else {
    v.appendChild(el("p", "trans", s[3]));
    v.appendChild(el("h2", null, "Palabras de hoy"));
    const ul = el("ul", "wordlist");
    for (const lemma of s[4]) {
      const i = BY_LEMMA.get(lemma.toLowerCase()); const w = WORDS[i];
      const li = el("li"); const es = el("span", "es");
      if (w[2]) es.appendChild(el("small", null, w[2] + " "));
      es.appendChild(document.createTextNode(w[0]));
      li.append(es, el("span", "en", w[1]));
      li.onclick = () => openSheet({ i });
      ul.appendChild(li);
    }
    v.appendChild(ul);
  }

  const done = el("button", "btn", "Terminé el cuento");
  done.onclick = finishStory;
  const r2 = el("div", "row stretch"); r2.appendChild(done); v.appendChild(r2);
}
function finishStory() {
  const s = STORIES[st.idx], t = today();
  for (const lemma of s[4]) if (!st.w[lemma]) st.w[lemma] = [1, t + 1];
  st.idx += 1; st.lastStory = t; markActive(); save();
  readingAhead = false; showTrans = false;
  refreshBadge(); renderStreak(); viewHoy();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- REPASO ---------- */
let rv = { q: [], pos: 0, open: false, dir: "es", done: 0, missed: new Set() };
function startReview() { rv.q = due(); rv.pos = 0; rv.open = false; rv.done = 0; rv.missed = new Set(); }
function viewRepaso() {
  const v = $("v-repaso"); v.textContent = "";
  const head = el("div", "row"); head.style.justifyContent = "space-between";
  const left = el("div"); left.appendChild(el("div", "eyebrow", "Repaso"));
  head.appendChild(left);
  const seg = el("div", "seg");
  for (const [k, txt] of [["es", "ES → EN"], ["en", "EN → ES"]]) {
    const b = el("button", null, txt); b.setAttribute("aria-pressed", String(rv.dir === k));
    b.onclick = () => { rv.dir = k; rv.open = false; viewRepaso(); };
    seg.appendChild(b);
  }
  head.appendChild(seg); v.appendChild(head);

  if (rv.pos >= rv.q.length) {
    const fresh = due();
    if (fresh.length && rv.q.length === 0) { startReview(); return viewRepaso(); }
    const e = el("div", "empty");
    e.appendChild(el("div", "glyph", rv.done ? "✓" : "·"));
    const total = Object.keys(st.w).length;
    let msg;
    if (!total) msg = "Todavía no hay palabras. Lee el cuento de hoy y sus palabras aparecerán aquí mañana.";
    else if (rv.done) msg = "Repasaste " + rv.done + (rv.done === 1 ? " palabra" : " palabras") + ". Nada más pendiente por hoy.";
    else msg = "Nada pendiente por hoy.";
    const tom = Object.values(st.w).filter(x => x[1] === today() + 1).length;
    if (total && tom) msg += " Mañana: " + tom + ".";
    e.appendChild(el("p", null, msg));
    v.appendChild(e);
    if (fresh.length) { startReview(); viewRepaso(); }
    return;
  }

  const lemma = rv.q[rv.pos], i = BY_LEMMA.get(lemma.toLowerCase()), w = WORDS[i];
  const pb = el("div", "progressbar"); const fill = el("i"); fill.style.width = (rv.pos / rv.q.length * 100) + "%"; pb.appendChild(fill);
  v.appendChild(pb);
  v.appendChild(el("p", "sub", (rv.pos + 1) + " de " + rv.q.length));

  const card = el("div", "card");
  const front = el("div", "front");
  if (rv.dir === "es") {
    if (w[2]) front.appendChild(el("small", null, w[2] + " "));
    front.appendChild(document.createTextNode(w[0]));
  } else { front.classList.add("en"); front.textContent = w[1]; }
  card.appendChild(front);
  if (!w[3]) { const c = el("p", "ctx", "Añadida por ti"); c.style.fontFamily = "var(--mono)"; c.style.fontSize = ".75rem"; card.appendChild(c); }
  if (rv.dir === "es" && w[4]) { const c = el("p", "ctx"); renderCtx(w[4], c); card.appendChild(c); }

  if (rv.open) {
    const a = el("div", "answer");
    if (rv.dir === "es") a.appendChild(el("div", "big", w[1]));
    else {
      const b = el("div", "big"); b.style.fontFamily = "var(--mono)"; b.style.color = "var(--cobalt)"; b.textContent = label(w); a.appendChild(b);
      if (w[4]) { const c = el("p", "ctx"); renderCtx(w[4], c); a.appendChild(c); }
    }
    const say = el("button", "btn ghost small", "Escuchar"); say.style.marginTop = "14px"; say.onclick = () => speak(w[0]);
    a.appendChild(say);
    card.appendChild(a);
  }
  v.appendChild(card);

  const r = el("div", "row stretch");
  if (!rv.open) {
    const b = el("button", "btn", "Mostrar"); b.onclick = reveal; r.appendChild(b);
  } else {
    const bad = el("button", "btn bad", "Otra vez"); bad.onclick = () => grade(false);
    const good = el("button", "btn good", "La sabía"); good.onclick = () => grade(true);
    r.append(bad, good);
  }
  v.appendChild(r);
  const k = el("p", "sub"); k.style.marginTop = "14px"; k.style.textAlign = "center";
  k.textContent = "Teclado: espacio para mostrar · 1 otra vez · 2 la sabía";
  v.appendChild(k);
}
function reveal() { rv.open = true; viewRepaso(); const w = WORDS[BY_LEMMA.get(rv.q[rv.pos].toLowerCase())]; speak(w[0]); }
function grade(ok) {
  const lemma = rv.q[rv.pos], t = today(), cur = st.w[lemma] || [1, t];
  if (ok && rv.missed.has(lemma)) st.w[lemma] = [1, t + 1];   // right on the second try: back tomorrow, no promotion
  else if (ok) { const b = Math.min(cur[0] + 1, INT.length - 1); st.w[lemma] = [b, t + INT[b]]; }
  else { st.w[lemma] = [1, t + 1]; rv.missed.add(lemma); rv.q.push(lemma); }
  rv.pos += 1; rv.open = false; rv.done += ok ? 1 : 0;
  markActive(); save(); refreshBadge(); renderStreak(); viewRepaso();
}
document.addEventListener("keydown", e => {
  if ($("v-repaso").hidden || !$("sheet").hidden) return;
  if (e.target.matches("input, textarea")) return;
  if (rv.pos >= rv.q.length) return;
  if (e.key === " ") { e.preventDefault(); if (!rv.open) reveal(); }
  else if (e.key === "1" && rv.open) grade(false);
  else if (e.key === "2" && rv.open) grade(true);
});

/* ---------- PALABRAS ---------- */
let filter = "seen", query = "", limit = 150;
function status(lemma) { const s = st.w[lemma]; if (!s) return "new"; return s[0] >= KNOWN ? "known" : "learning"; }
function viewPalabras() {
  const v = $("v-palabras"); v.textContent = "";
  v.appendChild(el("div", "eyebrow", "Tu banco de palabras"));
  const seen = Object.keys(st.w).length;
  const known = Object.values(st.w).filter(x => x[0] >= KNOWN).length;
  const stats = el("div", "stats");
  for (const [n, lab] of [[seen + " / " + WORDS.length, "palabras vistas"], [known, "ya sabidas"], [st.idx + " / " + STORIES.length, "cuentos leídos"], [streak() + (streak() === 1 ? " día" : " días"), "racha"]]) {
    const b = el("div", "stat"); b.appendChild(el("b", null, String(n))); b.appendChild(el("span", null, lab)); stats.appendChild(b);
  }
  v.appendChild(stats);

  const inp = el("input", "search"); inp.id = "search"; inp.type = "search"; inp.placeholder = "Buscar en español o en inglés"; inp.value = query;
  inp.setAttribute("aria-label", "Buscar palabra");
  v.appendChild(inp);
  const seg = el("div", "seg"); seg.style.marginTop = "10px";
  for (const [k, txt] of [["seen", "Vistas"], ["known", "Sabidas"], ["all", "Todas"]]) {
    const b = el("button", null, txt); b.setAttribute("aria-pressed", String(filter === k));
    b.onclick = () => { filter = k; limit = 150; viewPalabras(); }; seg.appendChild(b);
  }
  v.appendChild(seg);

  const ul = el("ul", "bank"); v.appendChild(ul);
  const more = el("div", "more"); v.appendChild(more);
  const draw = () => {
    ul.textContent = "";
    const q = query.trim().toLowerCase();
    const items = WORDS.map((w, i) => i).filter(i => {
      const w = WORDS[i], s = status(w[0]);
      if (filter === "seen" && s === "new") return false;
      if (filter === "known" && s !== "known") return false;
      return !q || w[0].toLowerCase().includes(q) || w[1].toLowerCase().includes(q);
    });
    const frag = document.createDocumentFragment();
    for (const i of items.slice(0, limit)) {
      const w = WORDS[i], s = status(w[0]);
      const li = el("li"); const es = el("span", "es");
      if (w[2]) es.appendChild(el("small", null, w[2] + " "));
      es.appendChild(document.createTextNode(w[0]));
      const tag = s === "known" ? "sabida" : s === "learning" ? "aprendiendo" : w[3] ? "día " + w[3] : "en espera";
      li.append(es, el("span", "st " + s, tag), el("span", "en", w[1]));
      li.onclick = () => openSheet({ i });
      frag.appendChild(li);
    }
    ul.appendChild(frag);
    more.textContent = "";
    if (!items.length) more.textContent = filter === "seen" && !q ? "Todavía no hay palabras vistas. Empieza con el cuento de hoy." : "Nada coincide con la búsqueda.";
    else if (items.length > limit) {
      const b = el("button", "btn ghost small", "Mostrar más (" + (items.length - limit) + ")");
      b.onclick = () => { limit += 300; draw(); }; more.appendChild(b);
    }
  };
  inp.oninput = () => { query = inp.value; limit = 150; draw(); };
  draw();

  // own words
  const add = el("div", "panel");
  add.appendChild(el("h2", null, "Añadir palabras"));
  const nOwn = st.custom.length, nWait = waiting();
  add.appendChild(el("p", null,
    "Una por línea, con su significado: «mercado = market». Entran al repaso, " + NEW_PER_DAY + " por día." +
    (nOwn ? " Tienes " + nOwn + " palabras tuyas" + (nWait ? ", " + nWait + " esperando turno." : ".") : "")));
  const ata = el("textarea"); ata.id = "addwords"; ata.setAttribute("aria-label", "Palabras nuevas");
  ata.placeholder = "el mercado = market\ncaminar = to walk\nbuenos días = good morning";
  add.appendChild(ata);
  const ar = el("div", "row"); ar.style.marginTop = "10px";
  const addBtn = el("button", "btn small", "Añadir");
  addBtn.onclick = () => {
    if (!ata.value.trim()) return toast("Escribe al menos una palabra con su significado.");
    const r = addWords(ata.value);
    const bits = [];
    if (r.added) bits.push(r.added + (r.added === 1 ? " añadida" : " añadidas"));
    if (r.known) bits.push(r.known + " ya estaban");
    if (r.noMeaning.length) bits.push(r.noMeaning.length + " sin significado: " + r.noMeaning.slice(0, 3).join(", ") + (r.noMeaning.length > 3 ? "…" : ""));
    const leftover = r.noMeaning.map(x => x + " = ").join("\n");
    refreshBadge(); viewPalabras(); toast(bits.join(" · ") || "Nada que añadir.");
    if (leftover) { const t = $("addwords"); t.value = leftover; t.focus(); }
  };
  ar.appendChild(addBtn);
  if (nOwn) {
    const exp = el("button", "btn ghost small", "Copiar mi lista para Claude");
    exp.onclick = () => {
      const txt = st.custom.map(c => (c[2] ? c[2] + " " : "") + c[0] + " = " + c[1]).join("\n");
      ata.value = txt;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Lista copiada. Pégala en el chat para recibir cuentos con estas palabras."), () => { ata.select(); toast("Selecciona el texto y cópialo."); });
      else { ata.select(); toast("Selecciona el texto y cópialo."); }
    };
    ar.appendChild(exp);
  }
  add.appendChild(ar);
  v.appendChild(add);

  // backup
  const pan = el("div", "panel");
  pan.appendChild(el("h2", null, "Copia de seguridad"));
  pan.appendChild(el("p", null, "Tu progreso vive solo en este navegador. Copia el código para guardarlo, o pégalo en otro dispositivo para continuar allí."));
  const ta = el("textarea"); ta.id = "backup"; ta.setAttribute("aria-label", "Código de progreso"); ta.placeholder = "Pega aquí un código para restaurar";
  pan.appendChild(ta);
  const r = el("div", "row"); r.style.marginTop = "10px";
  const copy = el("button", "btn small", "Copiar mi código");
  copy.onclick = () => {
    const code = JSON.stringify(st); ta.value = code;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => toast("Código copiado."), () => { ta.select(); toast("Selecciona el texto y cópialo."); });
    else { ta.select(); toast("Selecciona el texto y cópialo."); }
  };
  const load = el("button", "btn ghost small", "Restaurar desde el código");
  load.onclick = () => {
    try {
      const obj = JSON.parse(ta.value);
      if (typeof obj !== "object" || !obj || typeof obj.idx !== "number" || typeof obj.w !== "object") throw 0;
      st = Object.assign(fresh(), obj); syncCustom(); feedNew(); save(); refreshBadge(); renderStreak(); viewPalabras(); toast("Progreso restaurado.");
    } catch (e) { toast("Ese código no es válido. Copia el código completo y vuelve a intentarlo."); }
  };
  r.append(copy, load); pan.appendChild(r);
  v.appendChild(pan);

  const pan2 = el("div", "panel");
  pan2.appendChild(el("h2", null, "Empezar de nuevo"));
  pan2.appendChild(el("p", null, "Borra todo el progreso de este dispositivo y vuelve al día 1."));
  const conf = el("div", "row"); const wipe = el("button", "btn ghost small", "Borrar progreso");
  wipe.onclick = () => {
    conf.textContent = "";
    conf.appendChild(el("span", "sub", "¿Seguro? No se puede deshacer."));
    const yes = el("button", "btn bad small", "Sí, borrar todo");
    yes.onclick = () => { st = fresh(); syncCustom(); save(); refreshBadge(); renderStreak(); viewPalabras(); toast("Progreso borrado."); };
    const no = el("button", "btn ghost small", "Cancelar"); no.onclick = () => viewPalabras();
    conf.append(yes, no);
  };
  conf.appendChild(wipe); pan2.appendChild(conf);
  v.appendChild(pan2);
}

/* ---------- shell ---------- */
function refreshBadge() { const n = due().length, b = $("badge"); b.textContent = n > 99 ? "99+" : String(n); b.hidden = n === 0; }
function renderStreak() { const n = streak(); $("streak").textContent = n ? "racha · " + n + (n === 1 ? " día" : " días") : ""; }
function show(name) {
  for (const n of ["hoy", "repaso", "palabras"]) {
    $("v-" + n).hidden = n !== name;
    $("t-" + n).setAttribute("aria-selected", String(n === name));
  }
  closeSheet();
  if (name === "hoy") viewHoy();
  if (name === "repaso") { feedNew(); if (rv.pos >= rv.q.length || !rv.q.length) startReview(); viewRepaso(); }
  if (name === "palabras") viewPalabras();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.v));
document.addEventListener("visibilitychange", () => { if (!document.hidden) { feedNew(); refreshBadge(); renderStreak(); } });
refreshBadge(); renderStreak(); viewHoy();
</script>

</body>
</html>
